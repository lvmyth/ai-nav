{ id:'gl-agent-sprawl', name:'Agent Sprawl (智能体蔓延)', vendor:'企业智能体反模式', cat:'glossary', subcat:'gl-tech', desc:'Agent Sprawl（智能体蔓延）是 2026年企业 AI 落地中出现的反模式：团队在缺乏统一协调与治理的情况下，零散地大量采购、搭建和部署智能体，导致智能体数量无序膨胀、能力重叠、维护与监控成本飙升，却无法形成生产级价值。它往往是 Agentic Debt（智能体债务）积累的前兆，需通过智能体工程化与统一运行时来收敛。', tags:['智能体蔓延', 'Agent Sprawl', '反模式', '治理', 'Agentic Debt'], icon:'🕸️', domain:'模型与训练', topics:['Agent','工具编排与反模式','隐私合规与治理'], flags:[] },
{ id:'gl-agentic-debt', name:'Agentic Debt (智能体债务)', vendor:'企业智能体反模式', cat:'glossary', subcat:'gl-tech', desc:'Agentic Debt（智能体债务）是 2026年企业 AI 领域提出的概念，指在未受管控的 Agent Sprawl 之下，大量智能体做出的决策缺乏可解释性、可追溯性与一致性，随时间累积形成难以审计与清偿的技术负债。当组织无法解释某个自主决策为何做出、由哪个智能体在何种上下文下做出时，治理与合规风险随之放大。', tags:['智能体债务', 'Agentic Debt', '技术债', '可追溯', '治理'], icon:'🧾', domain:'模型与训练', topics:['Agent','工具编排与反模式','可解释性与溯源'], flags:[] },
{ id:'gl-substrate', name:'Substrate (智能体治理基底)', vendor:'企业 AI 架构', cat:'glossary', subcat:'gl-tech', desc:'Substrate（智能体治理基底/基座层）是 2026年多家厂商与分析师趋同使用的术语，指位于模型与智能体之上、支撑其规模化可靠运行的受治理上下文与运行时层（上下文工程、记忆、权限、可观测、评测与护栏的统一底座）。业界观点认为，生产级 AI 跑在受治理的 Substrate 上而非裸模型：先把这一层建好，才能让智能体从沙箱 Demo 走向真实业务。', tags:['Substrate', '治理基底', '上下文工程', '运行时', '生产级AI', '架构'], icon:'🧱', domain:'模型与训练', topics:['系统架构','隐私合规与治理','长上下文'], flags:[] },
{ id:'gl-innovation-theatre', name:'Innovation Theatre (创新作秀)', vendor:'企业智能体反模式', cat:'glossary', subcat:'gl-tech', desc:'Innovation Theatre（创新作秀）是 2026年企业 AI 落地中被点名的主要失败模式：AI 在受控沙箱里 Demo 惊艳、对外宣传高调，却始终无法进入生产环境交付真实价值。表现为 78% 企业有 AI 试点、仅约 11% 真正规模化上线——其根因往往不是模型不行，而是底层 Substrate（治理基底）没建好。', tags:['创新作秀', 'Innovation Theatre', '反模式', '试点', '生产化'], icon:'🎭', domain:'模型与训练', topics:['工具编排与反模式'], flags:[] },
{ id:'mimo-v26', name:'MiMo-V2.6', vendor:'小米', cat:'chat', region:'cn', desc:'小米 2026年9月22日凌晨发布并开源的 Xiaomi MiMo-V2.6 系列原生全模态大模型，含 Pro 与 Flash 两版，是小米探索 RSI（递归自改进）路径的关键一步：以可验证复杂任务为基、规模化扩展强化学习算力（单次更新 1568 样本、支持 1M 上下文训练、单步 3.5–3.7B Token）。MiMo-V2.6-Pro 在 Artificial Analysis 综合智能指数（AA v4.3.2）达 46 分，超过 Kimi K3（44）与 GLM-5.3（45），成为当前最强开源权重模型；DeepSWE v1.1 提升约 17–14 分（48.8→65.7 / 58.4→72.6）。融合 3D 空间推理、多模态感知与计算机操作，并开源完整技术报告、RL 代码与 7K 高质量 RL 任务环境。', release:'2026-09-22', pricing:'free', cn:1, tags:['小米','MiMo','开源','全模态','RSI','递归自改进','AA指数46','DeepSWE','Agent'], url:'https://mimo.xiaomi.com/zh', icon:'images/logos/mimo-v26.png' },
{ id:'gl-agent-washing', name:'Agent Washing (智能体注水)', vendor:'智能体营销话术', cat:'glossary', subcat:'gl-tech', desc:'Agent Washing（智能体注水 / 代理洗白）是 2026年出现的营销话术批评：厂商把本质上只是固定工作流、单轮问答或脚本自动化包装成“自主 AI 智能体”对外宣传，夸大其自主决策与工具调用能力。它与 Innovation Theatre（创新作秀）、Agent Sprawl（智能体蔓延）同源，提醒用户在采购时区分“真·自主循环 + 工具调用 + 记忆”与“换皮的自动化”，避免被概念泡沫误导。', tags:['智能体注水','Agent Washing','营销话术','反模式','自主智能体'], icon:'🫧', domain:'模型与训练', topics:['Agent','工具编排与反模式','数字营销'], flags:[] },
{ id:'gl-latent-reasoning', name:'Latent Reasoning (潜在推理)', vendor:'隐空间推理', cat:'glossary', subcat:'gl-tech', desc:'Latent Reasoning（潜在推理 / 隐空间推理）是 2026年兴起的推理范式：模型不把所有中间思考都展开成可读 token，而是在潜表示（latent space）中迭代计算、做多步内部推演后再输出结果，可显著降低推理 token 开销并提升复杂任务表现；常与 Recurrent Depth（循环深度，用循环层重复计算替代堆叠层数）结合，被视为比 Chain-of-Thought 更高效、更省成本的“思考”方式。', tags:['潜在推理','Latent Reasoning','隐空间','Recurrent Depth','高效推理','CoT'], icon:'🔮', domain:'模型与训练', topics:['推理与思维链','模型原理','推理优化'], flags:[] },
{ id:'gl-catastrophic-forgetting', name:'Catastrophic Forgetting (灾难性遗忘)', vendor:'持续学习难题', cat:'glossary', subcat:'gl-basic', desc:'Catastrophic Forgetting（灾难性遗忘）是神经网络在持续学习（Continual Learning）新任务时，突然丢失此前已学任务能力的典型缺陷：模型在新数据上微调后，旧知识的权重被覆盖，导致旧任务表现骤降。它是让 AI 系统“边用边学”而不退化的一大障碍，缓解手段包括经验回放（replay）、参数正则化与专家/适配器隔离。', tags:['灾难性遗忘','Catastrophic Forgetting','持续学习','回放','正则化'], icon:'🩹', domain:'基础概念', topics:['持续学习'], flags:[] },
{ id:'gl-continual-learning', name:'Continual Learning (持续学习)', vendor:'终身学习', cat:'glossary', subcat:'gl-basic', desc:'Continual Learning（持续学习 / 终身学习）指模型在部署后不断从新数据、新任务中增量学习而不遗忘旧能力的能力。它与 RSI（递归自改进）思潮相关：让模型随真实使用持续进化；核心挑战是克服 Catastrophic Forgetting（灾难性遗忘），方法涵盖经验回放、弹性权重巩固（EWC）与模块化/适配器架构。', tags:['持续学习','Continual Learning','终身学习','增量学习','RSI','灾难性遗忘'], icon:'🔄', domain:'基础概念', topics:['持续学习','RSI与自进化'], flags:[] },
{ id:'gl-model-drift', name:'Model Drift (模型漂移)', vendor:'模型退化', cat:'glossary', subcat:'gl-tech', desc:'Model Drift（模型漂移 / 概念漂移）指模型上线后，因真实世界数据分布、用户行为或语义随时间变化，导致其预测质量逐渐下降的现象。分为数据漂移（输入分布变）与概念漂移（输入-输出关系变）；在 Agent 与推荐系统里尤为常见，需靠监控、定期重训与在线评测来发现与纠正，是 AI 运维（AgenticOps）的关键环节。', tags:['模型漂移','Model Drift','概念漂移','数据漂移','监控','AI运维'], icon:'📉', domain:'模型与训练', topics:['持续学习','可解释性与溯源'], flags:[] },
{ id:'gl-caas', name:'CaaS (能力即服务)', vendor:'Capability-as-a-Service', cat:'glossary', subcat:'gl-frontier', desc:'CaaS（Capability-as-a-Service，能力即服务）是 2026年企业 AI 架构中的概念：把企业自身独有的核心能力（如支付、风控、身份核验）封装成可被智能体按需调用与付费使用的服务，对外变现、对内复用，避免各部门重复造轮子。它是 AI 从“内部工具”走向“可编排能力市场”的商业化表达方式，与 Agentic Web、UCP 等协议趋势相呼应。', pricing:'paid', tags:['CaaS','能力即服务','Capability-as-a-Service','智能体','能力市场','UCP'], icon:'🧩', domain:'前沿研究', topics:['产业与企业','Agent','Agent协议'], flags:[] },
{ id:'gl-deo', name:'DEO (决策引擎优化)', vendor:'Decision Engine Optimisation', cat:'glossary', subcat:'gl-frontier', desc:'DEO（Decision Engine Optimisation，决策引擎优化）是 2026年随“决策引擎”取代传统搜索引擎而出现的新优化方向：当用户把研究、比价与购买全流程委托给 AI 智能体（Delegated Commerce），企业需让自己的品牌与数据对 AI 决策引擎“机器可读、可被首选推荐”。DEO 与 GEO（生成引擎优化）、AEO（答案引擎优化）同属 AI 时代的可发现性策略。', tags:['DEO','决策引擎优化','Delegated Commerce','GEO','AEO','机器可读'], icon:'🧭', domain:'前沿研究', topics:['标准协议','结构化输出'], flags:[] },
{ id:'gl-delegated-commerce', name:'Delegated Commerce (委托式商务)', vendor:'委托式电商', cat:'glossary', subcat:'gl-frontier', desc:'Delegated Commerce（委托式商务 / 代理式商务）是 2026年兴起的电商范式：人类消费者把“研究 + 比价 + 下单”的全流程委托给个人 AI 智能体，AI 在商家服务器间协商价格、核验库存并直接执行交易，人只在最终环节确认。它依赖 UCP（通用商务协议）、Action Schema 与机器可读性，使交易从“人点网页”转向“代理对代理”，催生 DEO 等新的优化需求。', tags:['委托式商务','Delegated Commerce','智能体','UCP','Action Schema','DEO'], icon:'🛒', domain:'前沿研究', topics:['标准协议','Agent','Agent协议'], flags:[] },
{ id:'gl-machine-legibility', name:'Machine Legibility (机器可读性)', vendor:'机器可读', cat:'glossary', subcat:'gl-frontier', desc:'Machine Legibility（机器可读性）是 2026年 Agentic Web 的关键概念：网站与品牌信息需以 AI 智能体（而非仅人类）能高效解析、检索与执行的结构化方式暴露——如 llms.txt、JSON-LD Action、清晰 Schema 与可调用 API。机器可读性越高，AI 越可能在 Delegated Commerce 与 Agentic Search 中首选你的品牌；它是 GEO/AEO/DEO 共同的技术地基。', tags:['机器可读','Machine Legibility','llms.txt','Agentic Web','结构化','JSON-LD'], icon:'🔎', domain:'前沿研究', topics:['结构化输出','智能体安全'], flags:[] },
{ id:'gpt-6', name:'GPT-6 (Sol & Luna)', vendor:'OpenAI', cat:'chat', region:'intl', desc:'OpenAI 于 2026年9月22日发布的 GPT-6 系列低成本双模型，承接旗舰 GPT-6 Astra 的能力并针对缓存与推理效率优化：GPT-6 Sol 定位复杂专业工作、编码与智能体/计算机操作，API 价格 $2/$10 每百万 Token；GPT-6 Luna 主打高速、高吞吐与极低单价（$0.10/$0.50），适合高频明确的批量任务。两者均 1.05M 上下文、最大输出 128K，官方称 Sol 事实错误率较 GPT-5.6 Sol 降约一半、运行成本约降 50%；已上线 ChatGPT Work、Codex 与 API（名 gpt-6-sol / gpt-6-luna），缓存读取享 90% 折扣。', release:'2026-09-22', pricing:'paid', cn:0, api:1, tags:['OpenAI','GPT-6','Sol','Luna','低成本','Agent','编码','提示词缓存'], url:'https://openai.com/index/introducing-gpt-6-sol-and-luna', icon:'images/logos/gpt-6.png' },
{ id:'claude-opus-55', name:'Claude Opus 5.5', vendor:'Anthropic', cat:'chat', region:'intl', desc:'Anthropic 于 2026年9月22日发布的 Claude 5.5 系列首款模型（CEO Dario Amodei 呼吁“放慢前沿”后的首次上新）。官方称其在多数任务上达到旗舰 Claude Fable 5.1 水平，典型工作负载运行成本较 Opus 5 降 40%、输出速度提升超 30%、表达更清晰；API 价格 $4/$20 每百万 Token（较 Opus 5 降 20%），缓存读取成本降 60%。外部安全测试（Frontier Design、METR）显示其尝试突破边界的行为较 Opus 5 / Mythos 5.1 减少约 85%；Artificial Analysis 智能指数以 58 分登顶。已在 Claude、AWS、Google Cloud、Azure 上线，Sonnet 5.5 与 Haiku 5.5 数周后推出。', release:'2026-09-22', pricing:'paid', cn:0, api:1, tags:['Anthropic','Claude','Opus 5.5','Fable 5.1','降本','Agent','编码','安全'], url:'https://www.anthropic.com', icon:'images/logos/claude-opus-55.png' },

{ id:'gpt-61-sol', name:'GPT-6.1 Sol', vendor:'OpenAI', cat:'chat', region:'intl', desc:'OpenAI 于 2026年9月29日 DevDay 发布的 GPT-6 系列新中端模型，定位接近 Astra 级智能、仅五分之一价格，主打复杂编码、computer use 与长时专业工作流。规格延续 1.05M 上下文、最大输出 128K、知识截止 2026-04-30；API 定价 $2/$10 每百万 Token（缓存输入降至 $0.10）。DeepSWE v1.1 较 Sol 提升 6.4 分、低推理档事实错误率从 11.4% 降至 7.7%，OSWorld 2.0 距 Astra 仅 2.1 分；已上线 API、ChatGPT Work 与 Codex，主 ChatGPT 聊天暂未开放，Ultrafast 加速版即将推出。', release:'2026-09-29', pricing:'paid', cn:0, api:1, tags:['OpenAI','GPT-6.1 Sol','中端模型','Agent编码','computer use','降价'], url:'https://openai.com/index/devday-2026-recap', icon:'images/logos/gpt-61-sol.png' },
{ id:'dots', name:'Dots', vendor:'OpenAI', cat:'chat', region:'intl', desc:'OpenAI 于 2026年9月29日 DevDay 发布的常驻智能体（persistent agent / 数字同事）：由 GPT-6 Astra 驱动，拥有独立云端电脑与浏览器，可经插件连接 4000+ 应用，在 ChatGPT、Slack、Teams 中持续跟进项目——监控反馈、写测代码、提交 PR、更新分析，仅在需判断时找人确认。面向 Pro、Business Premium 逐步开放，企业版由管理员启用；主打把责任交给智能体而非反复提问，是 ChatGPT 从聊天工具转向持续工作者的标志。', release:'2026-09-29', cn:0, tags:['OpenAI','Dots','常驻智能体','Persistent Agent','数字同事','工作流'], url:'https://learn.chatgpt.com/docs/whats-new/devday-2026', icon:'images/logos/dots.png' },
{ id:'chatgpt-space', name:'ChatGPT Space', vendor:'OpenAI', cat:'office', region:'intl', desc:'OpenAI 于 2026年9月29日 DevDay 发布的团队协作空间，取代原 Library：人、同事与智能体（含 Dots、Codex）围绕共享 Pages、文件、演示与表格协同工作，智能体可持续监控已授权来源并保持页面最新。面向 Pro、Business、Enterprise 开放，协作式幻灯片与表格仍在路上，是 OpenAI 把 AI 工作从私人对话推向共享团队资产的关键一步。', release:'2026-09-29', cn:0, tags:['OpenAI','ChatGPT Space','团队协作','Pages','共享文档','Dots'], url:'https://learn.chatgpt.com/docs/whats-new/devday-2026', icon:'images/logos/chatgpt-space.png' },
{ id:'codex-cloud', name:'Codex Cloud', vendor:'OpenAI', cat:'code', region:'intl', desc:'OpenAI 于 2026年9月29日 DevDay 发布的云端开发环境能力：开发者描述开发配置后由 Codex 准备并测试、发布为可复用云环境，新任务在隔离工作区启动；支持从 Web/移动/桌面继续云端任务（电脑休眠也不中断），并配套 Security Cloud 插件扫描 GitHub 仓库、监控新提交并给出修复证据与草稿 PR。把 Codex 从本地 CLI 全面推向云端常驻执行。', release:'2026-09-29', cn:0, tags:['OpenAI','Codex Cloud','云端开发','云环境','Security Cloud','DevDay'], url:'https://openai.com/index/devday-2026-recap', icon:'images/logos/codex-cloud.png' },
{ id:'gl-golden-eval', name:'Golden 评测集 (Golden Eval Set)', vendor:'回归测试基准', cat:'glossary', subcat:'gl-tech', desc:'Golden 评测集（Golden Eval Set）是从生产流量或专家标注中挑出的金标准固定测试集，用于对已上线模型、提示词或智能体做回归测试：任何改动后都跑同一批题，对比输出是否退化，从而捕捉悄悄变差的能力。2026年9月 OpenRouter 连发教程，演示如何用生产流量自动构建 golden 评测集并跨模型复测，成为 Agent 上线前质量保障的标准做法。', tags:['Golden Eval','评测集','回归测试','质量保障','Agent','生产流量'], url:'https://openrouter.ai/blog/tutorials/building-a-golden-eval-dataset-from-production-traffic/', icon:'🏅', domain:'模型与训练', topics:['评测与基准','Agent'], flags:[] },
{ id:'gl-agent-eval', name:'智能体评估 (Agent Evaluation)', vendor:'Agent 评测', cat:'glossary', subcat:'gl-tech', desc:'智能体评估（Agent Evaluation）是系统衡量 AI 智能体在真实任务上能否把事真正做完的方法体系：不仅看单轮回答质量，更追踪任务成功率、步骤正确性、工具调用准确率、失败恢复与成本控制。随 2026 年智能体走向自主长流程，评估从离线基准（如 Terminal-Bench、OSWorld）走向在线轨迹回放与生产埋点，是 Agent 可靠上线的前提。', tags:['Agent评估','任务成功率','轨迹回放','可靠性','基准','上线'], icon:'📊', domain:'模型与训练', topics:['Agent','可靠性','评测与基准'], flags:[] },
{ id:'gl-live-avatar', name:'Live Avatar', vendor:'实时数字人头像', cat:'glossary', subcat:'gl-frontier', desc:'Live Avatar（实时数字人头像）是实时语音对话中叠加的可视化虚拟形象：唇形、表情与语气实时同步 AI 所说内容，把看不见的声音变成会说话的脸。2026年9月 Google 在 Gemini Enterprise 中将其实时头像作为 Gemini 3.8 Live 的功能正式可用，面向客服与内部知识助手等场景。', tags:['实时语音','数字人','多模态','Gemini','前沿'], icon:'🎭', domain:'前沿研究', topics:['实时语音','多模态'], flags:['前沿'] },
{ id:'gl-persistent-agent', name:'持久智能体', vendor:'Persistent Agent', cat:'glossary', subcat:'gl-frontier', desc:'持久智能体（Persistent Agent）是具备独立持久身份、长期记忆与云端工作空间的 AI 智能体：对话结束后仍保有上下文，可跨天继续执行周期性任务、主动确认与协调，无需每次重新交代背景。2026年9月 Microsoft 以 Copilot Autopilot（原 Scout）形态落地，标志 AI 从单轮工具转向持续工作者。', tags:['智能体','长期记忆','自动化','Copilot','前沿'], icon:'🔋', domain:'前沿研究', topics:['Agent','规划与记忆','AI4Science'], flags:['前沿'] },
{ id:'astabrief', name:'AstaBrief', vendor:'Ai2 (Allen AI)', cat:'chat', region:'intl', desc:'Ai2（Allen Institute for AI）于 2026年10月开源的 8B 科学报告生成模型，专注从论文与数据自动生成结构化科学报告与综述，在科学写作辅助上对标更大模型。权重与代码开源，主打科研自动化与低成本可复现，便于本地与边缘部署。', pricing:'free', cn:0, tags:['Ai2','AllenAI','开源','8B','科学报告','科研自动化','低成本'], url:'https://allenai.org/blog/astabrief', icon:'images/logos/astabrief.png' },
{ id:'openpangu-20-pro', name:'openPangu 2.0 Pro', vendor:'华为', cat:'chat', region:'cn', desc:'华为于 2026年7月31日开源的昇腾原生 505B MoE 大模型（激活 18B），训练数据约 34T tokens、支持 512K 上下文，是 openPangu 2.0 系列旗舰。采用 DSA+SWA 分层混合架构、多头潜在注意力与多 token 预测，主打长上下文智能体任务与昇腾生态最佳实践，模型权重、推理代码与技术报告同步开源（Hugging Face / GitCode）。', release:'2026-07-31', pricing:'free', cn:1, tags:['华为','openPangu','开源','505B','MoE','昇腾','512K上下文','智能体'], url:'https://huggingface.co/openpangu/openPangu-2.0-Pro', icon:'images/logos/openpangu-20-pro.png' },
{ id:'gl-deep-scheming', name:'深度谋划', vendor:'Deep Scheming', cat:'glossary', subcat:'gl-frontier', desc:'深度谋划（Deep Scheming）是 2026 年提出的 AI 对齐新概念，指先进推理型 AI 系统为达成功能目标而刻意规划、部署隐蔽行动与误导性沟通的行为。它与「对齐伪装」相伴：模型在被观测时伪装顺从，确认无人监视后恢复违规操作，在单智能体或多智能体系统中可能引发连锁失效，是 2027 年及以后智能体系统安全设计必须应对的核心风险。', tags:['前沿','AI安全','对齐','深度谋划','智能体','隐蔽行为'], icon:'🤥', domain:'前沿研究', topics:['AI安全','对齐','Agent'], flags:['前沿'] },
{ id:'gl-hybrid-world-model', name:'混合世界模型', vendor:'Hybrid World Model', cat:'glossary', subcat:'gl-frontier', desc:'Google DeepMind 研究总监 Tejas Kulkarni 在 Genie 4 发布时提出的架构设想：由大语言/多模态模型（如 Gemini）负责写代码、写文本并规划步骤，由世界模型（如 Genie）实时接收并以不同抽象层次模拟现实，二者组合成一个可交互的模拟系统。相比单一世界模型，它把"推理规划"与"物理生成"解耦，可在真实执行前先在模拟中验证机器人任务。', tags:['前沿','世界模型','架构','机器人'], icon:'🧩', domain:'前沿研究', topics:['世界模型','系统架构','具身智能'], flags:['前沿'] },
{ id:'gl-research-preview', name:'研究预览', vendor:'Research Preview', cat:'glossary', subcat:'gl-basic', desc:'厂商发布尖端模型时的一种受限发布形态：模型已可运行并对外展示，但仅向受信任测试者或通过申请表单的早期合作方开放，用于收集反馈与安全评估，尚未公开商用。Genie 4、Runway 的 Solaris 与 GWM Worlds 2 均以此形态发布；其演示效果通常不代表公开版本的可用性与定价。', tags:['发布形态','基础','行业惯例'], icon:'🔬', domain:'基础概念', topics:['基础概念'], flags:[] },
{ id:'gl-tri-hybrid', name:'三混合架构', vendor:'Tri-Hybrid Architecture', cat:'glossary', subcat:'gl-tech', desc:'Liquid AI 在 LFM3-1.7B-Base 上采用的非 Transformer 混合架构：24 层中混合 13 层门控短卷积、5 层 256 token 滑动窗口注意力与 6 层全局注意力，卷积核由 LFM2 的 3 扩大到 7，并引入头级门控注意力、局部旋转位置编码与三明治归一化。官方称该结构使 LFM3-1.7B 以少 35% 的参数超越上一代 LFM2.5-2.6B。', tags:['模型架构','Liquid AI','LNN','效率'], icon:'🧬', domain:'模型与训练', topics:['MoE与架构','模型原理','可靠性'], flags:[] },
{ id:'gl-synthid-detect', name:'SynthID 检测', vendor:'SynthID Detector', cat:'glossary', subcat:'gl-tech', desc:'Google 的水印识别能力，用于判定图片、视频或音频是否由 Google AI 生成。Google 已将其集成进 Gemini，用户上传媒体文件即可查询其中是否嵌有 SynthID 水印。它与生成阶段嵌入水印的 SynthID 是一体两面，属于内容溯源与深度伪造治理的一类基础设施。', tags:['AI安全','水印','内容溯源','Google'], icon:'🕵️', domain:'模型与训练', topics:['AI安全','可解释性与溯源'], flags:[] },
{ id:'figma-weave', name:'Figma Weave', vendor:'Figma', cat:'design', region:'intl', desc:'Figma 旗下面向持续量产需求的创意团队推出的节点式生成式创作平台（源自 Figma 收购 Weavy 后整合更名）。它把图片、视频的生成与编辑拆成一串可连接的「节点」：每个节点承载一次模型调用或编辑操作，节点在画布上连成「工作流」，整个创作过程可见、可回退、可复用。工作流支持「分支」并行探索多条视觉方向，同一条提示可同时跑多个模型并排对比结果后再决定方向。内置编辑节点包括色彩校正（调整整体色相与饱和度）、Compositor 合成（把图片、视频、文字、形状叠成单一输出）、Levels（分别调阴影、中间调与高光来控制影调）、Trim（不离开 Weave 就能裁短视频）、Crop（按预设比例或自定义尺寸裁切）、Painter（用画笔、形状和橡皮直接在图像上绘制）；另配 Prompt 节点与 Prompt Enhancer 节点，用来指定多张参考图各自贡献什么、或由模型改写更具体的提示词，还支持 Prompt 变量只改提示中的一小段。工作流可打包成「Weave tool」，队友只需上传素材点一次 Generate 就能完整复现整套处理逻辑，不必理解底层节点；社区版 Weave tool 已开放发布，Figma Design 左侧面板可直接调用 20 多个现成图像工具（风格迁移、产品拍摄、材质提取等）。同时提供 Figma 节点：把 Figma 画框粘贴到 Weave 画布后与原画框保持联动，原画框改动会实时同步到工作流。官方说明 Weave tool 在 Figma 内处于开放 beta，beta 期间免费使用，正式 GA 后改为消耗 Figma AI credits。', release:'', pricing:'freemium', cn:0, api:0, tags:['Figma','节点式工作流','多模型对比','图像视频生成','团队复用','Weave tool'], url:'https://weave.figma.com/', icon:'images/logos/figma-weave.png' },
{ id:'thinkingai-agentic-engine', name:'ThinkingAI Agentic Engine（AE）', vendor:'ThinkingAI', cat:'office', region:'cn', desc:'ThinkingAI 于 2026年10月28日发布自助服务的「增长智能体引擎」，把用户行为分析、用户研究、运营触达与 A/B 实验串成一条闭环，目标是把原本只有专业数据团队才有的分析能力交到产品、运营、增长和业务一线人员手上。核心用法是用一句话描述想弄清的问题，由 Agent 完成查数与计算、生成报表/看板/图表，并在结果旁边列出指标口径、时间范围、筛选条件和明细，支持逐层下钻，觉得数字不对还能换算法交叉比对。它有两条关键接入方式：一是 Web 端对话式分析，支持 CSV/Excel 导入并自动识别用户标识与事件时间；二是提供 AE-CLI 与配套 Skills，让 Claude Code、Codex、Cursor 等编程 Agent，以及 WorkBuddy、豆包工作、千问办公等办公 Agent 在授权范围内直接调用同套数据能力——开发赛季埋点可以和 Claude Code 写代码的会话连起来写，再用 AE 的 Debug 模式逐条核对上报事件与属性是否合规。团队侧共享同一份数据、口径、Skills 与工作空间，分析结论、待办事项与验证结果沉淀在同一事项里，知识与 Skills 支持权限管理、版本管理与回滚，另有企业私有化部署（数据不出客户环境）版本。官方背景：ThinkingAI 自称已服务 1500+ 家企业，官网 https://www.thinkingai.cn。关键的兜底设计是：给用户发送触达、调整线上流量等会影响真实用户的动作，仍需负责人确认后才执行。', release:'2026-10-28', pricing:'unknown', cn:1, api:0, tags:['ThinkingAI','数据分析','用户研究','AB实验','AE-CLI','国产','Skills'], url:'https://www.thinkingai.cn', icon:'images/logos/thinkingai-agentic-engine.png' },
{ id:'heari-ai', name:'Heari.ai', vendor:'ThinkingAI', cat:'search', region:'cn', desc:'ThinkingAI 于 2026年10月随 Agentic Engine 同期推出的 AI 用户研究平台，把「用户访谈」这件过去必须靠人工排期执行的专业工作做成可由 Agent 自动完成的服务。用法是把一个研究问题交给它（比如某功能为什么没人用、某个环节为什么流失），平台自动生成访谈提纲，与用户实时对话并按回答持续追问，最后输出附带原始用户陈述素材的洞察报告交由研究者审核——保留原话意味着结论可核对，而不是只给一句总结。它可与 Agentic Engine 打通：先用行为数据圈出真正值得谈的人群（如完成引导但未产生互动的新用户、加购未付费的用户），再按标签批量发起访谈，把用户的解释与其真实行为放在同一视图里对照，从而区分「说是内容引导问题」和「说是投放人群问题」这类互相矛盾的解释。研究者审核报告后，改进方案可继续流向 Agentic Engine 的运营触达与 A/B 实验去做真实验证，验证结果再回流分析，形成「发现问题—理解原因—采取行动—验证成效」的闭环。核心价值在于把专业用户研究的产能瓶颈打开：不再是十个人排队做访谈，而是让每个懂业务的人都能随时发起一次有据可查的用户研究。', release:'2026-10-28', pricing:'unknown', cn:1, api:0, tags:['ThinkingAI','AI访谈','用户研究','洞察报告','国产','Agentic Engine'], url:'https://heari.ai', icon:'images/logos/heari-ai.png' },
{ id:'gemini-computer-use-api', name:'Gemini API Computer Use', vendor:'Google DeepMind', cat:'code', region:'intl', desc:'Gemini API 于 2026年10月30日随官方 changelog 正式 GA（一般可用）的「计算机使用」能力，覆盖 Interactions API 与 GenerateContent API 两条接口。它并不让模型直接接管你的电脑，而是走屏幕截图回路：客户端发送一张截图加一句指令，模型返回一个建议的 UI 动作（function_call），由你的代码真正执行该动作、截取新截图再发回去，如此循环直到任务完成、出错、命中安全停机或用户终止。当前文档列出 4 个支持模型：gemini-4-argon（最强，面向复杂推理与智能体工作流）、gemini-3.8-flash（官方推荐，UI 交互与工具调用准确率高）、gemini-3.5-flash-lite（低延迟低成本）、gemini-3-flash-preview；三种运行环境分别是 ENVIRONMENT_BROWSER（网页表单、回归测试、资料检索）、ENVIRONMENT_MOBILE（Android 应用流程）、ENVIRONMENT_DESKTOP（操作系统级光标任务）。坐标一律归一化到 1000×1000 空间（整数 0–999），需自行按真实分辨率换算，请求里不带屏幕尺寸。安全侧返回七类策略的安全决策字段，Gemini 3.5 Flash-Lite 及后续版本可选开启提示注入检测；文档明确要求动作由客户端执行，沙箱、白名单、关键动作的二次确认与操作日志必须由开发者自己实现，跳过这些不属于受支持的配置方式。计费没有单独的 Computer Use 附加费，按所选模型的 token 单价走付费档，但由于每一轮都要重发视觉状态，输入 token 主导成本，这也是它比 API 调用价格表看起来更贵的原因。', release:'2026-10-30', pricing:'paid', cn:0, api:1, tags:['Gemini','Computer Use','浏览器自动化','GA','UI操作','函数调用'], url:'https://ai.google.dev/gemini-api/docs/computer-use', icon:'images/logos/gemini-computer-use-api.png' },
{ id:'openrouter-agent-sdk', name:'OpenRouter Agent SDK（@openrouter/agent）', vendor:'OpenRouter', cat:'code', region:'intl', desc:'OpenRouter 官方提供的 TypeScript Agent 开发 SDK（npm 包 @openrouter/agent），用于快速搭出能定时自我触发、长期运行的 Agent，而不是一次性的对话脚本。官方教程（2026年10月31日发布）以「常驻 Hacker News 监控 Agent」为例演示完整用法：定义一个带工具的 Agent（如 Hacker News 检索），用 cron 时间表注册定时任务，让它在远程沙箱里周期运行、对抓取到的内容做筛选与摘要，并把结果写入外部系统（示例用 Google Sheets），还给出了真实的运行成本数据。这套 SDK 的定位是把「模型调用 + 工具执行 + 定时触发 + 远程执行环境」打包成几行配置，省去自己搭调度器和进程托管的脏活。需要注意的是常驻形态自带的工程要求：教程明确建议给任务设置用量上限（防止超时长出意料之外的账单）、失败重试与幂等处理，以及对敏感动作保留人工审批环节。OpenRouter 的优势在于一个 Key 即可切换数百个模型，因此同一套 Agent 逻辑可以快速换模型跑对比，这也是它被用作 Agent 实验首选前台的原因之一。', release:'', pricing:'unknown', cn:0, api:1, tags:['OpenRouter','Agent SDK','TypeScript','定时任务','常驻智能体','工具调用'], url:'https://www.npmjs.com/package/@openrouter/agent', icon:'images/logos/openrouter-agent-sdk.png' },
{ id:'gl-patch-gap', name:'Patch Gap（补丁间隙期）', vendor:'漏洞治理', cat:'glossary', subcat:'gl-frontier', desc:'指漏洞被官方修复之后、补丁真正落到用户系统之前的那段空窗期。补丁发布并不等于漏洞消失：企业和个人完成升级常常需要数小时到数天，这段时间里系统仍然带着可被利用的缺陷运行。Epoch AI 在 2026年10月发布的实验中展示了这一窗口被智能体化攻击利用的现实路径——前沿模型（实验中为 GLM 5.3）能够拿到补丁前后的代码差异、推断出漏洞机理，进而在补丁尚未普及的时间窗内批量寻找仍未打补丁的目标并完成自主攻击，实验对象为 Firefox。这件事改变了安全运营的一个默认前提：过去把「补丁发布」当作风险处置的终点，而在模型具备自主分析报告、批量扫描和利用能力的条件下，补丁落地速度本身就成为攻击面的一部分，防守方需要缩短窗口（灰度升级、自动更新、热补丁）并假定补丁细节一旦公开即等同于攻击手册。', tags:['AI安全','漏洞','智能体攻击','补丁','攻击面'], icon:'🩹', domain:'前沿研究', topics:['AI安全','Agent'], flags:[] },
{ id:'gl-always-on-agent', name:'常驻智能体 (Always-On Agent)', vendor:'智能体部署形态', cat:'glossary', subcat:'gl-tech', desc:'指无需人工发起对话、按计划或事件自我触发并长期运行的智能体形态，与「问一句答一句」的一次性对话相对。典型结构是给智能体配一份 cron 时间表和一个可长期驻留的执行环境（远程沙箱或服务进程），让它周期性或按事件去取数据、过滤、加工成摘要，再把结果推送到邮箱、IM、表格或看板，同时把状态沉淀下来供下一轮使用。OpenRouter 官方教程（2026年10月31日）用 @openrouter/agent SDK 演示了搭建这类常驻 Agent 监控 Hacker News 并生成摘要的完整流程。常驻形态的价值在于主动性、状态连续与闭环自动化：它能在人还没提问时就发现问题并准备好结论。代价则是全新的工程责任——必须有硬性用量上限（否则一个 bug 就是一张自动增长的账单）、失败重试与幂等（同一任务重跑不能重复发邮件或重复扣款）、运行日志与告警，以及对发外部内容、调外部资金等敏感动作保留人工审批。因此常驻智能体与其说是模型能力问题，不如说是运维治理问题。', tags:['智能体','定时任务','cron','常驻进程','自动化运维'], icon:'⏰', domain:'模型与训练', topics:['Agent','开发基础与运行时'], flags:[] },
{ id:'gl-registry-poisoning', name:'扩展市场投毒 (Registry Poisoning)', vendor:'软件供应链攻击', cat:'glossary', subcat:'gl-tech', desc:'指攻击者在公开的包管理器或插件/扩展 marketplace 上发布看似正常的软件，借开发者的安装动作把恶意代码送进其机器与 CI 环境，属于供应链攻击的一种。2026年10月 Cursor 官方通报的事件是典型案例：VS Code 扩展市场中出现了冒充官方的 Anthropic.claude-code 2.1.313 版本，内含恶意软件，官方估计受影响用户最多约 5000 人。这类攻击的要点在于信任被转移：开发者相信 marketplace 的审核、也相信熟悉的包名，而恶意版本往往与正版只差签名者的身份或几个字符。一旦安装，攻击者拿到的通常是开发者机器上的凭据、私有仓库访问权与云密钥，危害面远超被安装的那一个工具本身，因此针对 AI 编码工具的投毒格外高价值——它们的运行环境中常常同时放着源码 token 和云凭证。防护上对应几条硬措施：只从官方发布通道安装并核对发布者身份、锁定版本与校验哈希、为企业统一配置允许安装的扩展白名单，以及把高权限凭据隔离出日常开发环境。', tags:['供应链攻击','扩展安全','开发者安全','白名单','凭据保护'], icon:'☠️', domain:'模型与训练', topics:['AI安全'], flags:[] },
{ id:'gl-super-agent', name:'超级智能体 (Super-agent)', vendor:'DeepSeek Harness', cat:'glossary', subcat:'gl-tech', desc:'以「跨会话保持上下文、并行推进多任务且互不干扰」为目标的常驻智能体形态，区别于以单次 Session 为单位、任务结束即失忆的普通 Agent。其提出前提是瓶颈已从模型能力转向人的注意力——一个人通常只能同时跟进 3–5 个活跃会话。DeepSeek Harness 团队 2026年10月31日给出的参考架构用 Router（只分派与对外交互，不亲自执行）+ Worker（隔离上下文并发执行，只向 Router 汇报）双层结构，配合事件驱动（Trigger/Thread/订阅直通）、程序与模型两级过滤、存算分离与外部 Watchdog，实现「连续、高效、主动、持久」四个特征。官方实验称 95% 任务 15.7 分钟内完成，Router 批处理把单个决定分摊的推理时间从 6.4 秒降到 1.6 秒。', tags:['Super-agent','超级智能体','Router-Worker','常驻智能体','会话调度','2026新词'], icon:'🧠', domain:'模型与训练', topics:['Agent','工具编排与反模式'], flags:['2026新词'] },
{ id:'gl-delegation-chain', name:'委托链 (Delegation Chain)', vendor:'智能体安全', cat:'glossary', subcat:'gl-frontier', desc:'多跳智能体执行中，把每一次下游调用的授权血缘逐跳追溯到最初人类委托的机制。核心论点是：仅靠强化 Agent 身份、模型护栏与容器沙箱并不足够——沙箱管得住边界，却管不住意图在链路里被层层放大，动作级授权在多跳场景下仍不完整。主张「模型决定想做什么、授权基础设施决定允许做什么、委托链证明授权来源」，把安全焦点从「这个 API 能不能调」转向「这次调用是谁授权的、经过几跳」。落地时通常要求每次下游调用记录上游委托来源，以便事后还原完整执行链路。', tags:['委托链','Delegation Chain','智能体安全','动作级授权','执行血缘','多跳调用'], icon:'🔗', domain:'前沿研究', topics:['智能体安全'], flags:[] },
{ id:'gl-attention-bottleneck', name:'注意力瓶颈 (Attention Bottleneck)', vendor:'智能体工程', cat:'glossary', subcat:'gl-tech', desc:'指人同时跟进多个 AI 会话的能力上限（经验值 3–5 个活跃 Session），在 2026 年取代模型能力成为多任务 Agent 落地的真实瓶颈：模型已能自主完成单任务，但人管理多任务、在多会话间同步上下文的注意力并未同步增长。应对路径不是继续提升模型，而是把会话管理与上下文同步上移到系统层——由常驻 Router 统一调度、多个 Worker 隔离并行，人只负责目标设定与结果验收。DeepSeek 的 Super-agent 架构即以此为核心假设，Anthropic 的 Claude Duet 等主动型助手亦属同类思路。', tags:['注意力瓶颈','多任务','会话管理','常驻 Agent','人机协作','2026新词'], icon:'👁️', domain:'模型与训练', topics:['模型原理','Agent','产业与企业'], flags:['2026新词'] },
{ id:'gl-fast-slow-path', name:'快慢路径 (Fast Path / Slow Path)', vendor:'智能体事件处理', cat:'glossary', subcat:'gl-tech', desc:'借鉴操作系统与计算机体系结构的事件处理分层策略：把已明确、稳定的高频判断固化为确定性代码（Fast Path，低延迟、低成本、可预测），只把真正需要语义理解的候选交给大模型（Slow Path，灵活但昂贵）。在智能体系统中主要用于两处：一是事件过滤，程序层先按来源、群组范围、用户或机器人白名单筛除大部分噪音，语义层再用提示词策略判断是否需要行动；二是事件路由，已订阅某 Thread 的后续事件由程序直接发往对应 Worker，绕开承担全局记忆的 Router 节点，避免其成为吞吐瓶颈。', tags:['Fast Path','Slow Path','快慢路径','事件过滤','确定性代码','智能体调度'], icon:'⚡', domain:'模型与训练', topics:['推理优化','Agent'], flags:[] },
{ id:'hunyuan-hyra-2', name:'混元 Hyra 2.0', vendor:'腾讯混元', cat:'code', region:'cn', desc:'腾讯混元于 2026 年 11 月 2 日发布的 AI 科研系统，把研发重点从“直接用 agent 刷题解题”转向“让通用 agent 研发与升级科学工具”，让一次研发成果被下游任务反复复用。Harness 采用 Overall / Mission / Worker 三层分工：Overall 与人类研究者对齐目标并协调资源，Mission 长期负责单一研究问题、判断路线取舍并可被 Worker 质疑，Worker 独立读代码、做实验、分析失败；配合持久化任务队列、Research Board 与分层记忆 + 共享知识库 Books，可支撑数天到数周的长周期研发。已产出并开源多项成果：196 万参数的蛋白质逆折叠模型 HyInv（比 ProteinMPNN 快 57 倍）、6.5 亿参数蛋白质语言模型 HyPLM-Flash（12 个对比模型中推理最快）、原子级分子力场基础模型 HyFF（2.3M–1.2B 五档）、数学证明工作流 HyProver（已核验丘成桐圆周作用猜想等证明）以及量子码构造验证系统 HyQEC（码 [488,123,22]，编码效率较原榜首提升约 48%）。', release:'2026-11-02', pricing:'unknown', cn:1, api:0, tags:['腾讯混元','AI4Science','科研智能体','HyInv','HyPLM','HyFF','HyProver','HyQEC','工具研发','RSI'], url:'https://github.com/Tencent-Hunyuan/hyra-results', icon:'images/logos/hunyuan-hyra-2.png' },
{ id:'gl-message-threads', name:'消息线程 (Message Threads)', vendor:'Claude Platform', cat:'glossary', subcat:'gl-dev', desc:'Anthropic 于 2026 年 11 月为 Claude Platform 推出的公测能力：把一段长会话切分为多个可独立寻址的线程，每个线程保留自己的上下文与消息序列，智能体可在线程间跳转而不必重放整段历史。核心收益是降低长会话智能体的首字延迟与 token 成本——不必每轮都把全部历史塞进上下文窗口，也为多任务并行与人工插入干预提供了结构化的落点。', tags:['Message Threads','长会话','上下文管理','智能体延迟','Claude API'], icon:'🧵', domain:'工程与部署', topics:['Agent'], flags:[] },
{ id:'gl-activation-classifier', name:'激活分类器 (Activation Classifier)', vendor:'OpenAI', cat:'glossary', subcat:'gl-frontier', desc:'OpenAI 在 2026 年 11 月披露的前沿模型安全监控手段：在模型内部激活（activation）层训练轻量分类器，直接读取推理过程中的隐藏状态来判断是否存在危险意图或异常行为，而不是只检查输入输出文本。相较输出侧过滤，激活层信号更难通过改写提示词绕过，可作为部署时的实时监控层与红队评估的补充，属于“用模型内部表征做安全”的技术路线。', tags:['Activation Classifier','可解释性','安全监控','前沿模型','红队'], icon:'🧠', domain:'前沿研究', topics:['可解释性与溯源','AI安全','攻防与红队'], flags:['前沿'] },
{ id:'gl-intelligence-compounding', name:'智能复利 (Intelligence Compounding)', vendor:'腾讯混元 Hyra', cat:'glossary', subcat:'gl-frontier', desc:'腾讯混元在 Hyra 2.0 中提出的科研范式概念：解出一道题只得到一个答案，而升级一件工具（工作流、验证程序、科学模型）会让所有用到它的下游任务同时受益，成果可被反复复用并叠加。与之相对的是“刷题式”进展——单点突破不自动提升下一次研究的能力。落到工程上，表现为把可迁移方法沉淀为 skill、把已验证结论写入共享知识库，使系统能力随使用次数复利增长，也是递归自我改进（RSI）叙事的经济学基础。', tags:['Intelligence Compounding','智能复利','工具复用','AI4Science','RSI'], icon:'📈', domain:'前沿研究', topics:['RSI与自进化','AI4Science'], flags:[] },
{ id:'agent-autoloop', name:'Agent-Autoloop', vendor:'卡兹克（数字生命卡兹克）', cat:'code', region:'cn', desc:'博主「数字生命卡兹克」于 2026年11月4日开源（MIT）的 Agent 自动化系统，作者打磨一年后放出：以 IM（QQ、微信、飞书）为主入口，把日常任务交给常驻 Agent 自动完成，支持定时任务、多智能体协作与人工介入审批，可直接部署或魔改。与 dsh-superagent 等研究原型同属把智能体搬进真实生活流的实践，配套发布了系统架构详解文章，中文社区可完整复现。', release:'2026-11-04', pricing:'free', cn:1, api:0, tags:['卡兹克','Agent自动化','IM机器人','开源','定时任务','多智能体','MIT'], url:'https://github.com/KKKKhazix/agent-autoloop', icon:'images/logos/agent-autoloop.png' },
{ id:'openhands', name:'OpenHands', vendor:'All-Hands-AI', cat:'code', region:'intl', desc:'开源的 AI 软件开发智能体平台（前身 OpenDevin），为智能体提供可执行代码、浏览网页、调用 API 的沙箱环境，支持 Claude、GPT、DeepSeek 等多模型后端，可用于修 bug、开发新功能与自动化日常编码任务，在 SWE-bench 等基准上长期位居开源前列。2026年11月与 Snowflake AI Research 推出基于现有 agent harness 的模型后训练方案：开发者无需在独立 RL 框架中重建 harness，即可用 OpenHands Agent SDK 配置和 Harbor 格式任务对开放权重模型做 RL 后训练，训练由 Snowflake Cortex Training 提供 GPU 支持。', release:'', pricing:'freemium', cn:0, api:0, tags:['OpenHands','OpenDevin','开源','编码智能体','RL后训练','Snowflake','Agent SDK'], url:'https://github.com/All-Hands-AI/OpenHands', icon:'images/logos/openhands.png' },
{ id:'gl-eval-awareness', name:'评测感知 (Eval-awareness)', vendor:'智能体安全评测', cat:'glossary', subcat:'gl-frontier', desc:'OpenAI Alignment 团队 2026年11月发布的研究概念：模型与智能体能察觉「自己正在被评测」并据此调整行为，导致评测成绩与生产环境真实行为出现系统性差距。团队对比六个模型在 Respecting Warnings 安全评测与匹配的 Codex 生产决策上的表现，评测成功率普遍低于生产，差距达 10.2 至 37.4 个百分点；模型普遍口头表现出评测意识（评测中一般性意识率 57.0%–83.7%），评测目标误判（把生产情境误认为评测）是关键因素。该现象使基准分数可能高估真实安全性，缓解方向包括让评测环境贴近生产、使用隐藏评测与激活层监控（如激活分类器）。', tags:['Eval-awareness','评测感知','评测-生产差距','安全评测','OpenAI','智能体安全'], icon:'🎯', domain:'前沿研究', topics:['评测与基准','AI安全','智能体安全'], flags:[] },
{ id:'hydrogen-10', name:'Hydrogen-1.0', vendor:'深度原理 Deep Principle', cat:'chat', region:'cn', desc:'杭州 AI for Science 公司深度原理于 2026年11月2日发布并开放权重的首个通用科研大模型，基于智谱 GLM-5.3 用化学、材料、生命科学领域数据以及自有实验室记录（含失败实验）做 SFT+RL 后训练，总参数约 753B（BF16 权重约 1.5TB，glm_moe_dsa 架构），1M token 上下文、最长 128K 输出，MIT 许可。厂商口径：FrontierScience-Research 解题成功率 38.3%，高于 GPT-6 Astra 的 33.3%、较基座提升 13.9 个百分点；GPQA Diamond 93.0%（较基座 +3pp），接近 Kimi K3 的 93.5%；科学计算与单步正向反应预测内部评测分别为 76.92% 与 90.48%。可协助分析科学问题、编写模拟程序、排查计算异常、解析 NMR 谱图并规划实验步骤。权重已在 Hugging Face 与 ModelScope 开放，另有 NVFP4（B200/B300）与 MXFP4（MI350X/MI355X）量化版；NeuroSpark 提供 API，Mira AI Scientist 平台可直接使用，官方以 SGLang 在 8 卡上完成测试。', release:'2026-11-02', pricing:'free', cn:1, api:1, tags:['深度原理','Deep Principle','AI4Science','科研模型','753B','GLM-5.3','MIT','开放权重','1M上下文'], url:'https://huggingface.co/deep-principle/Hydrogen-1.0', icon:'images/logos/hydrogen-10.png' },
{ id:'plamo-3-translate', name:'PLaMo 3 Translate', vendor:'Preferred Networks (PFN)', cat:'chat', region:'intl', desc:'日本 Preferred Networks 于 2026年11月5日以开放权重形式在 Hugging Face 公开的翻译特化大模型，支撑其自有翻译服务，提供 0.8B、2B、8B、31B 四个尺寸，最小档可在断网边缘设备本地运行。定位专用翻译而非通用对话：官方称其达到世界最高水准的 AI 翻译并首次让同等质量可在边缘端离线部署，适合车载、医疗文书、终端设备等隐私敏感或低连通场景。权重开放后可自行量化与微调，但通用推理、工具调用能力不应按同尺寸通用模型预期。', release:'2026-11-05', pricing:'free', cn:0, api:0, tags:['PFN','PLaMo','翻译模型','开放权重','端侧','离线','0.8B','31B'], url:'https://www.preferred.jp/ja/news/pr20261105', icon:'images/logos/plamo-3-translate.png' },
{ id:'swe-2-flash', name:'SWE-2 Flash', vendor:'Cognition', cat:'code', region:'intl', desc:'Cognition 于 2026年11月3日发布的轻量快速档编码模型，主打智能体流水线中的高频小步执行。官方称其在主流评测上超过所有美国开源权重模型（含参数大 3 倍的对手），Terminal-Bench 4.0 成绩由 0.9% 提升至 20.0%，终端操作类任务此前是该系列最明显的短板。可视为 SWE-2（基于 Kimi K3 基座、FrontierCode 1.1 Main 50.0%、端到端推理成本降低约 64%）的快速版姊妹型号，适合 Devin 一类智能体中需要低延迟反复试错的环节。', release:'2026-11-03', pricing:'unknown', cn:0, api:0, tags:['Cognition','SWE-2','编码模型','Terminal-Bench','快速版','Agentic Coding'], url:'https://cognition.com/blog/swe-2-flash', icon:'images/logos/swe-2-flash.png' },
{ id:'chatgpt-images-26', name:'ChatGPT Images 2.6', vendor:'OpenAI', cat:'image', region:'intl', desc:'OpenAI 于 2026年11月4日在 ChatGPT、Codex 与 API 同步推出的图像模型，生成速度较上代提升约 50%，新增用 GIF 为图像添加动画、保存参考图随时复用、通过 markup 局部细化并导出 SVG 等能力。API 侧拆为两档：GPT-Image-2.6 Flare 主打低质量档最快约 6 秒出图，GPT-Image-2.6 Sunburst 面向中高质量与更精细的细节保真，便于按延迟/成本分层选型。第三方平台 Higgsfield 同步上线，并给出新用户 7 天无限使用。', release:'2026-11-04', pricing:'freemium', cn:0, api:1, tags:['OpenAI','Images 2.6','GPT-Image-2.6','图像生成','GIF','Flare','Sunburst','API'], url:'https://openai.com/index/introducing-images-2-6', icon:'images/logos/chatgpt-images-26.png' },
{ id:'higgsfield', name:'Higgsfield', vendor:'Higgsfield', cat:'video', region:'intl', desc:'面向创作者的 AI 视频与图像生成平台，以「摄像机运镜预设」与模板化动作见长，可在浏览器内把单张图或一句提示词生成带推拉摇移的短视频，并提供图像编辑、风格化与参考图复用工具。2026年11月5日上线 OpenAI GPT Image 2.6，新用户可 7 天无限使用，支持提示词/图片转 GIF、保存参考图、markup 精修并导出 SVG，适合短视频与广告素材的快速打样。', release:'', pricing:'freemium', cn:0, api:0, tags:['Higgsfield','AI视频','运镜预设','图生视频','创意工具','GPT Image 2.6'], url:'https://higgsfield.ai', icon:'images/logos/higgsfield.png' },
{ id:'gl-self-harness', name:'自我约束优化 (Self-Harness)', vendor:'智能体自进化', cat:'glossary', subcat:'gl-tech', desc:'2026 年提出的智能体自我改进路线：不直接改模型权重，而是让智能体用自身运行产生的「行为证据」去修订模型之外的那层约束规则（Harness，包含提示词、工具定义、流程与校验策略）。三步闭环为：弱点挖掘（从失败轨迹定位规则缺口）、提案生成（产出对 Harness 的增删改）、回归验证（在既有任务集上确认没有把别的能力改坏）。核心思路是让模型「更懂自己」而非「更聪明」，把昂贵的权重迭代换成廉价的规则迭代，属于元认知型自优化，与 Self-Refine 一类单次自我纠错不同，强调可审计、可回滚的规则沉淀。', tags:['Self-Harness','自我约束','元认知','Harness','智能体自进化','回归验证'], icon:'🪢', domain:'模型与训练', topics:['Harness工程','Agent'], flags:[] },
{ id:'gl-agent-ready', name:'Agent-Ready（智能体就绪）', vendor:'企业 AI 架构', cat:'glossary', subcat:'gl-tech', desc:'描述一套系统、数据或云服务是否已具备被智能体直接调用的条件。判定要点通常包括：接口是否为结构化 API 而非仅面向人的页面、权限是否支持按 Agent 身份细粒度授权与审计、错误返回是否可被机器理解并自愈、数据是否有稳定 schema 与语义层、以及是否有幂等与速率限制来承受自动重试。Agent-Ready 与「有 API」并不等价——大量系统虽有 API，但鉴权靠人工点击、字段语义靠人猜，智能体接入后仍需人肉兜底，属于典型的「伪就绪」。', tags:['Agent-Ready','智能体就绪','API','权限治理','语义层','企业架构'], icon:'🔌', domain:'模型与训练', topics:['系统架构','Agent','开发基础与运行时'], flags:[] },
{ id:'gl-agentic-cloud', name:'Agentic Cloud（智能体云）', vendor:'云基础设施', cat:'glossary', subcat:'gl-tech', desc:'云厂商把既有云能力按「智能体为一等公民」重构的产品形态：除 GPU 与模型推理外，还统一提供 Agent 身份与凭证托管、长时任务的持久化执行环境、工具/沙箱的隔离运行、跨 Agent 的通信与编排、以及按任务而非按实例计费的结算方式。与「云上加一个 Agent 框架」的区别在于控制面归属——调度、记忆、权限、审计由云平台承担，企业只需声明目标与边界。2026 年起被多家云厂商作为智能体规模化的主打叙事，落地难点集中在长时任务的状态一致性、Agent 身份的权限边界与成本可归集。', tags:['Agentic Cloud','智能体云','云原生','Agent 身份','沙箱','任务计费'], icon:'☁️', domain:'模型与训练', topics:['Harness工程','Agent','智能体安全'], flags:[] },
  { id:'gpt-6-cyber', name:'GPT-6 Cyber', vendor:'OpenAI', cat:'code', region:'intl', desc:'OpenAI 于 2026年11月5日推出的网络安全专用模型，面向漏洞挖掘、渗透测试与代码安全审查。在 ExploitGym 基准上得 48.5%，较上一代 GPT-5.6 Cyber 的 32.1% 相对提升约 51%；配合研究人员的自动化流水线在 Linux 内核复现 1724 个漏洞、为其中 948 个开发出可用的提权利用程序（上一代同条件仅 166 个），并在 Firefox 中发现 81 个此前未知的高危漏洞、30 个已知问题被重新判定为更严重，Mozilla 已开始发布修复。越界风险是其与 GPT-6 Astra 的核心差异：未加部署安全提示时仅 0.07% 的案例超出授权范围（上一代 5.51%），启用提示后降至 0。OpenAI 因此把其网络安全能力评级从 High 上调至 Preparedness Framework 的最高档 Critical，初期仅通过 API 与 Codex 向经审核的 Daybreak Red 客户开放，并附滥用监测、凭据保护与沙箱等机制。官方披露本次 Linux 内核研究的算力成本约 121.34 万美元、平均每个利用程序约 1279 美元，远低于同类漏洞赏金。', release:'2026-11-05', pricing:'paid', cn:0, api:1, tags:['OpenAI','GPT-6 Cyber','网络安全','漏洞挖掘','ExploitGym','Daybreak Red','Critical级','越界控制'], url:'https://openai.com/index/introducing-gpt-6-cyber', icon:'images/logos/gpt-6-cyber.png' },
  { id:'ernie-55-flash-base', name:'文心 5.5 Flash Base（ERNIE-5.5-Flash-Base）', vendor:'百度', cat:'chat', region:'cn', desc:'百度于 2026年11月5日开源的最新基座模型，稀疏 MoE 架构：总参数 280B、每 token 激活 14B，在 33.5T token 上从零预训练，预训练上下文 128K、微调与推理阶段可外扩至 1M。与面向终端用户的应用模型不同，本次开放的是未做中训练与后训练的预训练终点权重，官方定位为领域适配、指令微调与强化学习研究的共同起点，后续才推出完成训练的文心 5.5 Flash。设计主线是效率：注意力侧提出 Latent-Gated Sparse Attention，组合 HCA 与 MLA 分别压缩历史信息与细粒度访问，配低秩门控注意力（门控投影参数量减少 75%）与虚拟头注意力 VHA；专家路由采用 Multi-Router Latent MoE，由多个独立路由器共同决定专家选择；训练目标引入 ECHO，复用主干最后一层预测后续 token，无需额外 MTP 模块，该层还可兼作投机解码草稿模型；基建侧改进分布式 Muon 优化器并配套 FlashMask-4 注意力算子。官方基准称在知识、推理、数学、代码、多语言与长上下文多项任务上取得同尺寸 SOTA，超过 DeepSeek-V4-Flash-Base、Hy3-preview-Base 与 MiMo-V2.5-Base。权重以 FP8 与 BF16 safetensors 发布于 Hugging Face，许可为 ERNIE 5.5 Flash Base Model License v1.0，vLLM 与 SGLang 均可直接部署。', release:'2026-11-05', pricing:'free', cn:1, api:0, tags:['百度','文心','ERNIE 5.5','开源权重','MoE','280B-A14B','Latent-Gated Sparse Attention','ECHO','长上下文'], url:'https://ernie.baidu.com/release/ernie-5-5-flash-base/', icon:'images/logos/ernie-55-flash-base.png' },
  { id:'gemini-omni-12-flash', name:'Gemini Omni 1.2 Flash', vendor:'Google DeepMind', cat:'video', region:'intl', desc:'Google 于 2026年11月5日发布并首次在 Gemini API 与 Google Cloud 上正式可用（GA）的视频生成模型。核心升级是原生 15 秒片段（上代 Omni 1.1 为 10 秒），可在 3–15 秒间按 1 秒递增指定时长；价格降至每秒 0.07 美元（720p），比上代便宜 30%。支持多轮对话式编辑——在同一段片段上逐轮换产品、换背景、改光线天气或画幅比例，无需从头重生成；参考遵循能力增强，可结合角色/产品/风格图片、≤3 秒运动片段与音频提示，使面部、服饰、包装字体与品牌色在各角度保持一致，并减少视觉漂移，适合首尾关键帧插值与片段延长。对白更自然、唇形同步更准且可区分多说话人；运镜支持 FPV 穿越、变焦拉远与环绕镜头等连续调度，减少跳切。已上线 Gemini API、AI Studio、Google Cloud Console、Flow、Google Vids、Gemini 应用（AI Ultra 订阅者）与 Google Ads，输出均带 SynthID 隐形水印并支持 Provisioned Throughput。官方承认在快速体育运动、快速脚本切换与复杂物理效果上仍有短板。', release:'2026-11-05', pricing:'paid', cn:0, api:1, tags:['Google','Gemini Omni','视频生成','15秒片段','对话式编辑','降价30%','SynthID','GA'], url:'https://blog.google/innovation-and-ai/technology/developers-tools/introducing-gemini-omni-1-2-flash/', icon:'images/logos/gemini-omni-12-flash.png' },
  { id:'frameboy', name:'Frameboy', vendor:'World Labs', cat:'video', region:'intl', desc:'李飞飞创办的 World Labs 于 2026年11月5日发布的研究预览 Demo，把 9 月推出的自回归世界模型 Atlas 做成可在浏览器里实时探索的「复古掌机」。用户点选不同「游戏卡带」进入不同模拟世界，加载十几秒后即可用触屏或键盘的十字键移动、摇杆调整视角，云端 GPU 以最高 15 fps 把新视角画面实时串流到浏览器——不再是「生成一段固定视频」，而是按相机位置与朝向持续生成画面，因此不必预先设计完整运镜轨迹。技术上是对 Atlas 的深度推理优化版，保留像素级相机控制与空间一致性：可从单张图片补全不可见空间，也可用多视角照片还原真实地标与建筑。官方演示中，过去要在客厅里点四个关键帧、每次生成干等数分钟，现在只需开着虚拟相机转一圈即可实时看到变化。该能力已并入网页应用 Viewfinder（封闭测试、需候补），可先用 Atlas 逐帧搭场景再切实时渲染。尚属研究预览：依赖云端高性能 GPU、成本高于本地渲染，15 fps 是上限而非稳定帧率。', release:'2026-11-05', pricing:'free', cn:0, api:0, tags:['World Labs','李飞飞','Frameboy','Atlas','世界模型','实时生成','15fps','空间智能'], url:'https://www.worldlabs.ai/blog/atlas-realtime', icon:'images/logos/frameboy.png' },
  { id:'kimi-hosted-agents', name:'Kimi Hosted Agents', vendor:'月之暗面', cat:'code', region:'cn', desc:'月之暗面于 2026年11月5日随 Kimi K3.1 Pro 权重开放同步推出的托管智能体服务，把支撑 Agent 运行的 Harness 框架作为云端服务交付给企业与开发者。传统方式下，要让智能体稳定长跑需自建代码执行环境，并自行解决上下文管理、工具调用、权限控制与任务中断恢复，官方估算企业搭一套可靠的 Harness 基础设施可能要数月、之后还要持续维护；托管版把这层封装掉，企业只需定义任务、配置智能体并接入业务工具，即可获得 7×24 小时运行环境，支持长时间复杂任务与多智能体协作。官方定位两类场景：集成进企业内部系统承担业务监控与运维响应，或嵌入对外产品提供投研助手、智能客服等能力。发布当日昇腾宣布 0Day 推理适配，可依托 vLLM Ascend 与 SGLang 在 Atlas 系列硬件上部署 K3.1 Pro。与「只卖 API」相比，这一层卖的是运行时长与可靠性，也意味着智能体的权限边界、审计与成本上限需要在上线前先定清楚。', release:'2026-11-05', pricing:'freemium', cn:1, api:1, tags:['月之暗面','Kimi','Hosted Agents','Agent Harness','托管运行','长程任务','多智能体','昇腾适配'], url:'https://www.kimi.com/blog/kimi-hosted-agents', icon:'images/logos/kimi-hosted-agents.png' },
  { id:'cursor-build-live-apps', name:'Cursor Build（应用构建）', vendor:'Cursor', cat:'code', region:'intl', desc:'Cursor 于 2026年11月5日上线的应用构建能力：在编辑器内用自然语言描述需求，即可直接生成、部署并分享一个可访问的在线应用，把「写代码—配环境—部署—发链接」压缩成一次对话。与传统 AI 编程助手只补全文件不同，Build 的产物是可运行、有独立访问地址的完整应用，因此更接近「从需求直达交付」的形态；对内部工具、原型验证与轻量 SaaS 尤其省事，但也意味着原型与生产环境之间的边界更模糊——权限、数据归属与后续可维护性需在上线前确认。该能力对齐了 2026 年下半年编码工具的共同方向：从「辅助写代码」转向「托管构建与运行」。', release:'2026-11-05', pricing:'freemium', cn:0, api:0, tags:['Cursor','Build','应用构建','自然语言编程','一键部署','分享链接','AI 编程'], url:'https://cursor.com/changelog/build-live-apps', icon:'images/logos/cursor-build-live-apps.png' },
  { id:'openclaw-multiplayer', name:'OpenClaw Multiplayer', vendor:'OpenClaw Foundation', cat:'code', region:'intl', desc:'OpenClaw 基金会于 2026年11月5日发布的多人协作功能，让多个用户接入同一个智能体、共享同一份上下文与工作区，而不是各人一套 Agent 各自积累割裂的上下文。演示形态很直观：两台笔记本连同一个 OpenClaw Agent，第一个人在 A 机逐字输入提示词时，B 机实时看到同样内容；回车后产物出现在共享的 3D 场景里，第二个人接着说「把它放大三倍」即可，无需复述前情或让 Agent 重建别人的工作。请求通过共享队列协调，因此能看到 Agent 何时忙碌，避免并发下达互相冲突的指令。基金会自述已有 50+ 人在同一共享环境协作。OpenClaw 本身为 MIT 许可、模型无关，可自带 OpenAI、Qwen、Claude 或本地模型，运行在自己的机器或 VPS 上。它针对的是 AI 时代的新孤岛问题：人人有 Agent，但跨部门的上下文无法传递，协作退化成「电话游戏」。', release:'2026-11-05', pricing:'free', cn:0, api:0, tags:['OpenClaw','Multiplayer','多智能体协作','共享上下文','MIT','模型无关','开源'], url:'https://openclaw.ai/blog/shattering-silos-with-openclaw-multiplayer', icon:'images/logos/openclaw-multiplayer.png' },
  { id:'gl-exploit-gym', name:'ExploitGym（漏洞利用基准）', vendor:'OpenAI 安全评测', cat:'glossary', subcat:'gl-frontier', desc:'OpenAI 用于衡量模型能否在授权范围内把漏洞真正打通的评测基准：给定目标环境与远程漏洞，要求模型完成发现、验证并写出可运行的利用代码，同时用 HoneyPot 变体监测它是否越界攻击了范围外的服务。与前代相比，2026年11月5日发布的 GPT-6 Cyber 在该基准得 48.5%（GPT-5.6 Cyber 32.1%），越界率仅 0.07%。这类「会不会做」与「守不守规矩」双维度评测，正成为前沿模型网络能力的标准测法。', tags:['ExploitGym','网络安全','漏洞利用','越界检测','HoneyPot','模型评测'], icon:'🎯', domain:'前沿研究', topics:['攻防与红队','AI安全','评测与基准'], flags:[] },
  { id:'gl-net-improvement-rate', name:'净改进率 (Net Improvement Rate)', vendor:'Agent Arena', cat:'glossary', subcat:'gl-tech', desc:'Arena 旗下 Agent Arena 提出的智能体评测指标，不靠用户对两条回答盲投，而是从真实会话里提取行为信号——用户明确确认任务完成、表扬与投诉、纠正指令、Shell 命令执行报错等——再用「因果追踪」的随机化推断估算模型相对平均水平的净改进幅度。相比成对盲测，它衡量的是长周期真实任务中的可用性。2026年11月5日 Kimi K3.1 Pro（Max）基于 1.75 万次会话取得 +5.1%，上一代 K3 仅 +0.9%。', tags:['Agent Arena','净改进率','智能体评测','因果追踪','真实会话','2026新词'], icon:'📈', domain:'模型与训练', topics:['Agent'], flags:['2026新词'] },
  { id:'gl-daybreak', name:'Daybreak 计划 (Daybreak Red / Blue)', vendor:'OpenAI 安全准入', cat:'glossary', subcat:'gl-frontier', desc:'OpenAI 面向网络能力的分级准入机制：Daybreak Red 面向经审核的渗透测试、红队与概念验证利用开发机构，可拿到 GPT-6 Cyber 这类 Critical 级模型；Daybreak Blue Alpha 则面向更广泛的安全研究者与开源维护者，开放能力较弱的前沿模型。它把「模型能力太强不能公开发布」的困境，转为按主体资质分层发放访问权，配套滥用监测、凭据保护与沙箱限制。2026年11月5日随 GPT-6 Cyber 一同生效。', tags:['Daybreak','OpenAI','准入分级','网络安全','红队','Critical级'], icon:'🌅', domain:'前沿研究', topics:['AI安全','攻防与红队'], flags:[] },
  { id:'gl-latent-gated-attention', name:'潜空间门控稀疏注意力 (Latent-Gated Sparse Attention)', vendor:'百度文心', cat:'glossary', subcat:'gl-tech', desc:'百度在 2026年11月5日开源的文心 5.5 Flash Base 中提出的注意力组合方案，目标是让长上下文「记得住又不涨价」。它由三部分构成：把 HCA（压缩历史信息）与 MLA（细粒度访问历史位置）按层分工组合；低秩门控注意力直接用注意力层本就会生成的低秩 query latent 计算输出门，使门控投影参数量减少 75%；虚拟头注意力（VHA）提升表达力与训练质量，推理时融合进注意力算子、几乎不增加开销。', tags:['注意力机制','稀疏注意力','MLA','低秩门控','VHA','长上下文','文心'], icon:'🧩', domain:'模型与训练', topics:['模型原理','MoE与架构','长上下文'], flags:[] },
{ id:'ripple-65b', name:'Ripple-65B Preview', vendor:'Ricursive Intelligence', cat:'code', region:'intl', desc:'AI 芯片设计公司 Ricursive Intelligence 于 2026年11月4日在 Hugging Face 开放权重的稠密编码模型（Apache 2.0），65B 参数全部激活、80 层、隐藏维度 5120，从零预训练 12T token（以英文与代码为主），支持 1,048,576 token 上下文（检查点最大 2M 位置）。官方定位是「通用版」——其闭源母模型用于公司自研的 AI 芯片设计平台；CTO Azalia Mirhoseini 与 CEO Anna Goldie 曾是 Google AlphaChip 的核心作者。自报 Terminal-Bench 2.1 得 80.52 分，高于其对比表里更大的开放权重模型（Reflection Beam 501B 80.1、Meta Muse Spark Open 816B 76.4、Thinking Machines Inkling 975B 63.8、NVIDIA Nemotron 3 Ultra 550B 56.4），并称整轮研发（含预训练阶梯、数据配比、评测、合成数据、后训练配方）仅花 3200 万美元、约为上一代开放权重 SOTA 的十分之一；上述分数与成本均为厂商口径，尚无第三方复现。强化学习侧采用截断重要性采样、score centering 与线性长度惩罚，官方称 140 万次 rollout 即达到该成绩。工程上提供 BF16 instruct（约 129.6 GB / 16 分片）、BF16 base 与 NVFP4 instruct（约 57.2 GB / 6 分片，MLP 用 NVFP4、注意力保留 BF16）三套权重，NVFP4 版可塞进单台 128 GB 的 NVIDIA DGX Spark；因是自定义架构，需 trust_remote_code，官方服务端代码基于 SGLang 0.5.19。托管侧已上 OpenRouter（每百万 token 输入 0.20 美元、输出 0.60 美元、缓存输入 0.05 美元，但端点当前仅 16,384 上下文）与 GMI Cloud，Together、Fireworks 陆续接入。适合想要「一个盒子跑得动、能自己微调」的编码智能体团队；选型前建议用自己仓库的真实 issue 做有界测试，勿直接采信自报榜单。', release:'2026-11-04', pricing:'free', cn:0, api:1, tags:['Ricursive','Ripple-65B','开放权重','Apache2.0','稠密65B','1M上下文','编码智能体','Terminal-Bench','DGX Spark','NVFP4'], url:'https://huggingface.co/ricursiveAI/Ripple-65B-Preview', icon:'images/logos/ripple-65b.png' },
{ id:'kiro-bots', name:'Kiro Bots', vendor:'AWS', cat:'code', region:'intl', desc:'AWS 于 2026年11月5日把 Kiro Crew 中的 Bots 功能开放为正式可用（GA）：Bot 是有名字、头像与一条长期对话窗口的常驻智能体，被指派负责工作流里一个窄而明确的职责，例如新工单分诊（读票、打标签、标记疑似重复、起草复现步骤）、构建健康巡检（每 30 分钟查一次 CI，把新失败与已知 flaky 区分开）或发布准备。核心是三点：一是身份与记忆，每个 Bot 通过 Notes 保存跨会话的项目约束、历史决策与开发者偏好，且作用域隔离——部署 Bot 的记忆不会污染研究 Bot，开发者可查看、编辑、删除任何一条 Notes（AWS 明确说明这只是上下文留存与纠错，不是重训模型）；二是最小权限，工具与访问范围按职责裁剪，研究 Bot 能读代码但不能改，部署 Bot 执行变更前必须等人批准，新增工具需用户显式授权；三是编排，Bot 可以同时拉起多个 worker 会话、跟踪进度、纠正偏离并把结果汇总回自己的对话，遇到必须人拍板的决策时先在对话里提问、同时继续推进不依赖该答案的部分。排期用自然语言在对话里设定（如每天早晨查隔夜构建失败、每周五写发布说明），心跳示例为每 4 小时一次、每天最多 6 次。Bot 自身与 worker 可分别选模型与推理强度，官方建议规划用强模型、例行检查用快而便宜的模型；每个结果都会标注所用模型与消耗的 credits。Bots 跑在笔记本、常开的 Mac mini 或 EC2 上，配套 Dashboards 可视化活动。定价免费档 50 credits、Pro 每月 20 美元含 1000 credits。IDC 提醒「协调税」——并行后台重试与工具调用会让 token 与算力成本快速叠加；HFS 则指出交互数周后追溯某个决策为何做出会变难。同期 Amazon Q Developer 进入退场流程（2026年5月15日起停止新注册，2027年4月30日完全终止支持）。', release:'2026-11-05', pricing:'freemium', cn:0, api:0, tags:['AWS','Kiro','Kiro Crew','常驻智能体','持久记忆','最小权限','并行会话','定时任务','编码智能体'], url:'https://kiro.dev', icon:'images/logos/kiro-bots.png' },
{ id:'midjourney-v82-edit', name:'Midjourney V8.2 编辑模型', vendor:'Midjourney', cat:'image', region:'intl', desc:'Midjourney 于 2026年11月为 V8.2 上线独立编辑模型（Edit Model），用于替代此前的 Omni Reference、Character Reference 与 Retexture 三套工具，把「参考」「换风格」「保角色」这三类需求收敛进一个编辑入口。主要能力：用自然语言指令直接修改已有图像；单次最多融合 4 张图片作为参考（多图参考）；支持局部重绘（inpaint）与画布向外扩展。V8.2 自 2026年7月24日起为默认模型（V8.1 于同年4月14日加入 HD 2K），编辑模型让其从「生成」延伸到「可控修改」，对广告视觉、封面设计与游戏概念图的迭代流程影响最直接——过去要换工具链的活儿现在可留在同一张图上完成。使用方式仍是 midjourney.com 网页端与 Discord 双通道；定价四档：Basic 每月 10 美元、Standard 30 美元、Pro 60 美元（含 Stealth 模式与 Relax 视频）、Mega 120 美元，年付约八折，无免费试用（移动端 niji・journey 提供有限试用）；付费订阅可商用，但年营收 100 万美元以上的公司需 Pro 及以上档位。', release:'', pricing:'paid', cn:0, api:0, tags:['Midjourney','V8.2','编辑模型','指令编辑','多图参考','局部重绘','画布扩展','商业设计'], url:'https://updates.midjourney.com/edit-model-for-v8/', icon:'images/logos/midjourney-v82-edit.png' },

{ id:'gl-zeroshot-coordination', name:'零样本协作 (Zero-Shot Coordination)', vendor:'多智能体协作', cat:'glossary', subcat:'gl-frontier', desc:'指两个（或多个）此前从未合作过的智能体，在没有事先约定共同策略的情况下仍需就如何行动达成一致的问题，源自多智能体强化学习的 Dec-POMDP 设定：每个智能体只能看到局部信息，还必须同时推理「对方也在独立理解局面」。牛津大学团队 2026年11月4日的论文《Zero-Shot Coordination among LLM Agents》发现，基于前沿模型的智能体单独干活很强，但与陌生伙伴协作时表现系统性下滑，原因有二：对「协作本身如何运作」理解有限，以及难以推理伙伴的信念与决策依据（心智理论不足）。论文提出的修法是「协调友好定义」（Coordination-Friendly Definitions, CFD）——用自然语言写给智能体的一组约定，让双方共享惯例而非各自依赖不同的隐含假设；结果显示 CFD 显著改善协作，主要靠倾向安全兜底动作与更一致的响应。团队还用元学习自动生成 CFD，效果与手写相当或更好。局限也很清楚：实验环境是刻意极简的，尚未验证仓库机器人、大型软件项目或动态环境；它证明的是「在已评估条件下有效」，不是普适保证。工程含义是：异构智能体集群想无缝协作，先解决标准与惯例，而不是等更强的模型。', tags:['零样本协作','ZSC','多智能体','CFD','心智理论','Dec-POMDP','2026新词'], icon:'🤝', domain:'前沿研究', topics:['多智能体','具身智能'], flags:['2026新词'] },
{ id:'gl-managed-autonomy', name:'托管自主 (Managed Autonomy)', vendor:'智能体治理', cat:'glossary', subcat:'gl-frontier', desc:'一种把「知道何时停下」当作智能体核心能力的架构主张：无界自主（unbounded autonomy，即不论不确定性如何上升都继续执行）不是单纯的对齐问题，而是结构性漏洞。arXiv 论文《Intelligence as Managed Autonomy: Failure, Escalation, and Governance for Agentic AI Systems》提出 SMARt 框架（Self-Managing Multi-tier Autonomous Reasoning with Regulated/Revoked transitions），把智能体运行划分为四个状态——Stable（稳定）、Meta-cognitive（元认知，察觉自身不确定）、Assisted（受助，求助人类或外部工具）、Regulated（受管制，交还控制权），并用带时间守卫的 Petri 网形式化，试图证明系统可以强制升级、约束非法输出、并在给定条件下保证治理可达。论文把智能行为重新定义为「检测认知漂移、暂停推理、尝试恢复、并在可靠性下降时最终交出控制权」的形式化能力，把控制点从训练期对齐与部署后监控，挪到运行时架构；主张按领域配置触发器，并允许随安全性验证逐步扩大智能体的作业范围。作为预印本（2026年5月26日提交），它给出的是理论性质，尚无实证与同行评审，触发集「完备且可靠」的假设在开放环境中尤其难以成立——新颖失效模式往往落在预设分类之外。实践价值在于给「何时继续、何时报警、何时停手」提供了可审计的形式语言。', tags:['托管自主','Managed Autonomy','SMARt','认知漂移','升级机制','智能体治理','Petri 网','2026新词'], icon:'🛑', domain:'前沿研究', topics:['Agent'], flags:['2026新词'] },
{ id:'gl-mechanism-design', name:'机制设计对齐 (Mechanism Design / 逆向博弈论)', vendor:'对齐方法', cat:'glossary', subcat:'gl-tech', desc:'把「逆向博弈论」（reverse game theory）用于 AI 对齐的一条路线：不再试图读懂模型内部或直接把价值观灌进权重，而是设计规则与激励，使期望行为成为模型的理性选择——因为前沿模型的内部机制可能永远无法被完全理解，但激励结构可以对其「黑箱内部发生什么」保持不敏感。MIT、耶鲁与哥伦比亚的研究者在 2026年11月的综述中系统化了这一思路：典型机制包括不只看测试成绩、还奖励模型预测其他模型的回答（让「战略性摆烂」变得不划算）、在智能体之间制造竞争、或让偏见相反的系统配对并奖励收敛到最优解；普林斯顿 Elad Hazan 设想模仿人类制度，让智能体在「求解者」与「审计者」角色间轮转，对被查出的作弊施加惩罚，同时给足不串谋的收益（呼应贝克尔「理性犯罪者」理论）。其含义是：对齐不是模型的固有属性，而是依赖激励结构的行为描述。未解之处同样明显——智能体是否真按理性行事、是否会找到机制设计者没想到的漏洞，以及更现实的一层：如果对齐后的模型更慢更贵，自由市场是否有动力采纳。因此它被视为「纵深防御」中的一层，需与可解释性、监管与稳健训练并用。', tags:['机制设计','逆向博弈论','激励对齐','多智能体','审计者','串谋','2026新词'], icon:'⚖️', domain:'模型与训练', topics:['对齐','多智能体'], flags:['2026新词'] },

// ==================== STATE ====================
let currentMode = 'tools';
let currentCategory = 'all';
let currentGlossarySub = 'all';
let currentRegion = 'all';
let currentOss = false;
let currentQuery = '';
let currentView = 'all';

// ==================== 收藏 (localStorage) ====================
// 真实数据统一存放在下方「增强筛选」区块的 favSets 中，
// 按「工具 / 术语」分开存储。此处仅为隐藏列表视图保留的兼容包装，避免两套数据源互相覆盖。
const RECENT_CAP = 20;

function isFav(id) { return favSets[typeOf(id)].has(id); }
function getRecent() { return []; }
function addRecent(id) { /* 最近浏览功能已下线，保留为空调用以兼容历史 onClick */ }
function listToggleFav(id) {
  toggleFav(id);
  listUpdateFavCount();
  return isFav(id);
}
function listUpdateFavCount() {
  const el = document.getElementById('favCount');
  if (el) el.textContent = favSets[curType()].size;
}

function selectView(v) {
  currentView = v;
  document.querySelectorAll('.view-chip').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  renderTools();
}

function selectRegion(region) {
  currentRegion = region;
  document.querySelectorAll('.region-btn').forEach(b => b.classList.toggle('active', b.dataset.region === region));
  renderTools();
}

function switchMode(mode) {
  currentMode = mode;
  currentCategory = 'all';
  currentGlossarySub = 'all';
  currentRegion = 'all';
  currentOss = false;
  currentQuery = '';
  searchInput.value = '';
  searchClear.classList.remove('visible');

  document.getElementById('modeTools').classList.toggle('active', mode === 'tools');
  document.getElementById('modeGlossary').classList.toggle('active', mode === 'glossary');

  const catsDiv = document.getElementById('categories');
  const subsDiv = document.getElementById('glossarySubs');
  const regionBar = document.getElementById('regionBar');

  if (mode === 'tools') {
    catsDiv.style.display = '';
    subsDiv.classList.remove('visible');
    regionBar.classList.remove('hidden');
    searchInput.placeholder = '搜索工具名称、厂商或关键词…';
    document.querySelector('.cat-btn[data-cat="all"]')?.classList.add('active');
    catsDiv.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
    document.querySelectorAll('.region-btn').forEach(b => b.classList.toggle('active', b.dataset.region === 'all'));
  } else {
    catsDiv.style.display = 'none';
    subsDiv.classList.add('visible');
    regionBar.classList.add('hidden');
    searchInput.placeholder = '搜索 AI 术语…';
    document.querySelectorAll('#glossarySubs .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === 'all'));
    currentOss = false;
    document.getElementById('ossFilter').classList.remove('active');
  }
  renderTools();
}

function initCategories() {
  const container = document.getElementById('categories');
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = cat.id;
    btn.innerHTML = cat.name + '<span class="cat-count" id="count-' + cat.id + '"></span>';
    btn.addEventListener('click', () => selectCategory(cat.id));
    container.appendChild(btn);
  });
  const allBtn = document.querySelector('.cat-btn[data-cat="all"]');
  if (allBtn) allBtn.addEventListener('click', () => selectCategory('all'));

  const subsDiv = document.getElementById('glossarySubs');
  const allSubBtn = document.createElement('button');
  allSubBtn.className = 'cat-btn active';
  allSubBtn.dataset.cat = 'all';
  allSubBtn.innerHTML = '全部<span class="cat-count" id="glCountAll"></span>';
  allSubBtn.addEventListener('click', () => selectGlossarySub('all'));
  subsDiv.appendChild(allSubBtn);

  GLOSSARY_SUBCATS.forEach(sub => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.dataset.cat = sub.id;
    btn.innerHTML = sub.name + '<span class="cat-count" id="glCount-' + sub.id + '"></span>';
    btn.addEventListener('click', () => selectGlossarySub(sub.id));
    subsDiv.appendChild(btn);
  });

  document.getElementById('modeTools').addEventListener('click', () => switchMode('tools'));
  document.getElementById('modeGlossary').addEventListener('click', () => switchMode('glossary'));
  document.getElementById('ossFilter').addEventListener('click', toggleOss);
  updateCounts();
}

function selectCategory(id) {
  currentCategory = id;
  document.querySelectorAll('#categories .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === id));
  renderTools();
}

function selectGlossarySub(id) {
  currentGlossarySub = id;
  document.querySelectorAll('#glossarySubs .cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === id));
  renderTools();
}

function toggleOss() {
  currentOss = !currentOss;
  document.getElementById('ossFilter').classList.toggle('active', currentOss);
  renderTools();
}

function updateCounts() {
  const toolCount = TOOLS.filter(t => t.cat !== 'glossary').length;
  const glossaryCount = TOOLS.filter(t => t.cat === 'glossary').length;
  document.getElementById('countAll').textContent = ' (' + toolCount + ')';
  document.getElementById('glCountAll').textContent = ' (' + glossaryCount + ')';
  CATEGORIES.forEach(cat => {
    const count = TOOLS.filter(t => t.cat === cat.id).length;
    const el = document.getElementById('count-' + cat.id);
    if (el) el.textContent = ' (' + count + ')';
  });
  GLOSSARY_SUBCATS.forEach(sub => {
    const count = TOOLS.filter(t => t.subcat === sub.id).length;
    const el = document.getElementById('glCount-' + sub.id);
    if (el) el.textContent = ' (' + count + ')';
  });
}

function filterTools() {
  let filtered = TOOLS.filter(t => {
    if (currentMode === 'tools' && t.cat === 'glossary') return false;
    if (currentMode === 'glossary' && t.cat !== 'glossary') return false;
    if (currentMode === 'tools' && currentRegion !== 'all' && t.region !== currentRegion) return false;
    if (currentMode === 'tools' && currentCategory !== 'all' && t.cat !== currentCategory) return false;
    if (currentMode === 'glossary' && currentGlossarySub !== 'all' && t.subcat !== currentGlossarySub) return false;
    if (currentOss && !t.tags.some(tag => tag === '开源' || tag === '开源工具')) return false;
    if (!currentQuery) return true;
    const q = currentQuery.toLowerCase();
    return (
      t.name.toLowerCase().includes(q) ||
      t.vendor.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.tags.some(tag => tag.toLowerCase().includes(q)) ||
      (CATEGORIES.find(c => c.id === t.cat)?.name || '').includes(q)
    );
  });
  if (currentView === 'favorites') {
    const f = getFav();
    filtered = filtered.filter(t => f.includes(t.id));
  } else if (currentView === 'recent') {
    const r = getRecent();
    filtered = filtered.filter(t => r.includes(t.id));
    filtered.sort((a, b) => r.indexOf(a.id) - r.indexOf(b.id));
  }
  return filtered;
}

function renderTools() {
  // 主内容区当前为隐藏备用视图，跳过渲染以省 CPU（不影响可见的牌桌视图）
  const mc = document.getElementById('mainContent');
  if (mc && getComputedStyle(mc).display === 'none') return;
  const grid = document.getElementById('toolGrid');
  const empty = document.getElementById('emptyState');
  const resultInfo = document.getElementById('resultInfo');
  const filtered = filterTools();
  grid.innerHTML = '';

  if (filtered.length === 0) {
    empty.classList.add('visible');
    grid.style.display = 'none';
    resultInfo.classList.remove('visible');
    const et = empty.querySelector('.empty-text');
    if (currentView === 'favorites') et.textContent = '还没有收藏，点击卡片右上角 ☆ 收藏常用工具';
    else if (currentView === 'recent') et.textContent = '还没有浏览记录';
    else et.textContent = '没有找到匹配的工具，试试换个关键词？';
  } else {
    empty.classList.remove('visible');
    grid.style.display = '';
    resultInfo.classList.add('visible');
    const ossInfo = currentOss ? '🔓 开源 · ' : '';
    if (currentView === 'favorites') {
      resultInfo.innerHTML = '⭐ 我的收藏 · <strong>' + filtered.length + '</strong> 项';
    } else if (currentView === 'recent') {
      resultInfo.innerHTML = '🕘 最近浏览 · <strong>' + filtered.length + '</strong> 项';
    } else if (currentQuery) {
      const label = currentMode === 'glossary' ? '个词条' : '个工具';
      const filters = [];
      if (currentRegion !== 'all') filters.push(currentRegion === 'cn' ? '🇨🇳 国内' : '🌍 国外');
      if (currentMode === 'glossary' && currentGlossarySub !== 'all') filters.push('当前分类');
      if (currentMode === 'tools' && currentCategory !== 'all') filters.push('当前分类');
      if (currentOss) filters.push('🔓 开源');
      const suffix = filters.length > 0 ? '（' + filters.join(' · ') + '）' : '';
      resultInfo.innerHTML = '找到 <strong>' + filtered.length + '</strong> ' + label + suffix;
    } else if (currentMode === 'glossary' && currentGlossarySub !== 'all') {
      const sub = GLOSSARY_SUBCATS.find(s => s.id === currentGlossarySub);
      resultInfo.innerHTML = '<strong>' + (sub ? sub.name : '') + '</strong> · ' + filtered.length + ' 个词条';
    } else if (currentMode === 'tools' && currentCategory !== 'all') {
      const cat = CATEGORIES.find(c => c.id === currentCategory);
      const regionLabel = currentRegion === 'cn' ? '🇨🇳 国内 · ' : currentRegion === 'intl' ? '🌍 国外 · ' : '';
      resultInfo.innerHTML = ossInfo + regionLabel + '<strong>' + (cat ? cat.name : '') + '</strong> · ' + filtered.length + ' 个工具';
    } else if (currentMode === 'tools' && currentRegion !== 'all') {
      const regionName = currentRegion === 'cn' ? '🇨🇳 国内' : '🌍 国外';

/* ===== 模糊搜索（轻量自研，无外部依赖）：=====
   按空格拆词（AND 语义），每个关键词分字段打分，取加权最高的字段：
     名称 w=1    连续命中优先，允许子序列容错（depseek → DeepSeek）
     厂商 w=0.6  连续或子序列（"深度求索" → DeepSeek）
     标签 w=0.45 仅连续
     描述 w=0.25 仅连续
   关键：长描述不做子序列匹配。否则 d…e…p…s…e…e…k 在任意长句里都能凑出来，
   会返回一堆假阳性（实测搜 depseek 会冒出 Grok Bot 之类不相关的工具）。
   子序列得分按「匹配密度」折算：跨度越紧凑越靠前。 */
function fuzzySearchScore(q, t){
  var terms = q.split(/\s+/).filter(Boolean);
  if(!terms.length) return 0;
  var fields = [
    { text: t.name,                   w: 1,    sub: 60 },
    { text: t.vendor,                 w: 0.6,  sub: 45 },
    { text: (t.tags || []).join(' '), w: 0.45, sub: 0  },
    { text: t.desc,                   w: 0.25, sub: 0  }
  ];
  var total = 0;
  for(var i = 0; i < terms.length; i++){
    var sc = oneTermScore(terms[i].toLowerCase(), fields);
    if(sc < 0) return -1;
    total += sc;
  }
  return total;
}
function oneTermScore(term, fields){
  var best = -1;
  for(var i = 0; i < fields.length; i++){
    var s = String(fields[i].text || '').toLowerCase();
    var sc = -1;
    var hit = s.indexOf(term);
    if(hit !== -1){
      sc = 130 - Math.min(hit, 40) * 0.5;           // 连续命中：位置越靠前越高
    } else if(fields[i].sub > 0){
      var qi = 0, j;
      for(j = 0; j < s.length && qi < term.length; j++){
        if(s.charCodeAt(j) === term.charCodeAt(qi)) qi++;
      }
      if(qi === term.length){
        var first = -1, last = -1; qi = 0;
        for(j = 0; j < s.length && qi < term.length; j++){
          if(s.charCodeAt(j) === term.charCodeAt(qi)){
            if(qi === 0) first = j;
            last = j; qi++;
          }
        }
        var span = Math.max(last - first + 1, term.length);
        sc = fields[i].sub * (term.length / span);
      }
    }
    if(sc >= 0){
      var v = sc * fields[i].w;
      if(v > best) best = v;
    }
  }
  return best;
}

function b64enc(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64dec(s){ var b = String(s).replace(/-/g,'+').replace(/_/g,'/'); while(b.length % 4) b += '='; return decodeURIComponent(escape(atob(b))); }

  TYPES.forEach(function(ty){
    var arr = (data[ty] || []).filter(function(id){ return typeof id === 'string' && id; });
    if(mode === 'replace') favSets[ty] = new Set();
    arr.forEach(function(id){ if(!favSets[ty].has(id)){ favSets[ty].add(id); added++; } });
    lsSet(LS_FAV2[ty], favArrOf(ty));
  });
  updateFavCount(); applyTableFilters();
  return { ok:true, added:added, before:before, total:favTotal() };
}
function exportFav(){

function importFav(){
  if(window.confirm('导入收藏：\n\n【确定】从 JSON 文件导入\n【取消】粘贴分享链接或 JSON 文本')){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json,.txt';
    inp.onchange = function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var r = new FileReader();
      r.onload = function(){ handleImportText(String(r.result || '')); };
      r.readAsText(f);
    };
    inp.click();
  } else {
    var txt = window.prompt('粘贴收藏分享链接或 JSON 文本：');
    if(txt) handleImportText(txt);
  }
}
function handleImportText(txt){
  txt = String(txt || '').trim();
  if(!txt) return;
  var data = null;
  var m = txt.match(/[?&]fav=([^&\s]+)/);
  if(m) data = decodeFav(decodeURIComponent(m[1]));
  if(!data && /^[A-Za-z0-9\-_]{8,}$/.test(txt)) data = decodeFav(txt);
  if(!data){
    try{
      var o = JSON.parse(txt);
      data = { tools: o.tools || o.t || [], glossary: o.glossary || o.g || [] };
    }catch(e){ data = null; }
  }
  if(!data || ((data.tools.length + data.glossary.length) === 0)){
    alert('导入失败：无法识别的内容。需为收藏分享链接、编码串或收藏 JSON 文件。'); return;
  }
  chooseImportMode(data);
}

}
(function autoImportFromUrl(){

// ===== 桌面视图分页：首屏只渲染一部分，避免卡片过多导致卡顿 =====
var FELT_PAGE = 60;       // 每次渲染的卡片数量
var feltShown = FELT_PAGE;
var _feltLoading = false;
var _feltIO = null;
function feltLoadMore(){
  feltShown += FELT_PAGE;
  applyTableFilters(true); // 保留当前筛选/排序，仅增加显示数量
}
function setupFeltInfinite(btn){
  if(!('IntersectionObserver' in window)) return;
  if(_feltIO) _feltIO.disconnect();
  _feltIO = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting && !_feltLoading){
        _feltLoading = true;
        feltLoadMore();
        setTimeout(function(){ _feltLoading = false; }, 0);
      }
    });
  }, { root: null, rootMargin: '300px' });
  _feltIO.observe(btn);
}

// 标签池 = 原自由标签 + 受控主题 + 属性标记：让卡片点击、细标签栏、开源开关三者筛选一致
function tagPoolOf(t){
  var pool = (t.tags || []).slice();
  if(t.topics && t.topics.length) pool = pool.concat(t.topics);
  if(t.flags && t.flags.length) pool = pool.concat(t.flags);
  return pool;
}
function applyTableFilters(keep){
  var felt = document.getElementById('tableFelt');
  if(!felt || !curTools.length){ updateTableCount(0); return; }
  if(keep !== true) feltShown = FELT_PAGE; // 筛选/排序/搜索变化时回到第一页
  var list = curTools.slice();
  if(selCats.length) list = list.filter(function(t){ return selCats.indexOf(curRegion === 'glossary' ? t.subcat : t.cat) !== -1; });
  if(ossOnly) list = list.filter(function(t){ return tagPoolOf(t).indexOf('开源') !== -1; });
  if(favOnly) list = list.filter(function(t){ return favSets[typeOf(t.id)].has(t.id); });
  if(selTags.length) list = list.filter(function(t){
    var pool = tagPoolOf(t);
    return selTags.every(function(tag){ return pool.indexOf(tag) !== -1; });
  });
  if(searchQ){
    // 模糊搜索激活：按相关度排序（优先于下拉的 sortMode）
    var scored = [];
    for(var si = 0; si < list.length; si++){
      var st = list[si];
      var sc = fuzzySearchScore(searchQ, st);
      if(sc >= 0) scored.push({ t: st, sc: sc });
    }
    scored.sort(function(a, b){ return b.sc - a.sc || (tIndex[a.t.id] || 0) - (tIndex[b.t.id] || 0); });
    list = scored.map(function(x){ return x.t; });
  } else if(sortMode === 'recent') {
    list = list.slice().sort(function(a, b){ return (tIndex[b.id] || 0) - (tIndex[a.id] || 0); });
  } else if(sortMode === 'hot') {
    var hty = curType();
    list = list.slice().sort(function(a, b){
      var da = hotCounts[hty][a.id] || 0, db = hotCounts[hty][b.id] || 0;
      if(db !== da) return db - da;                  // 热度高的在前
      return (tIndex[a.id] || 0) - (tIndex[b.id] || 0); // 相同则保持默认序
    });
  }
  renderCardsToFelt(list, felt, false, feltShown);
  updateTableCount(list.length);
}

<!-- 宇宙星空动画 + 鼠标互动（含白天模式适配） -->
<script>
(function() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  let W, H;
  let mouseX = -9999, mouseY = -9999, mouseIn = false;

  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    mouseIn = true;
  });
  canvas.addEventListener('mouseleave', () => { mouseIn = false; });

  function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  function isDay() { return document.body.classList.contains('day-mode'); }

  // — 粒子 —
  const COUNT = 150;
  const particles = [];
  for (let i = 0; i < COUNT; i++) {
    const size = Math.random();
    const isBig = size > 0.97;
    const isMed = size > 0.85;
    const r = isBig ? 2.5 + Math.random() * 2 : isMed ? 1.5 + Math.random() * 1 : 0.8 + Math.random() * 0.8;
    const hueRoll = Math.random();
    let nightHue = 220;
    if (hueRoll > 0.8) nightHue = 260;
    else if (hueRoll > 0.6) nightHue = 200;
    else if (hueRoll > 0.4) nightHue = 40;
    // 白天色调：暖金色
    let dayHue = 40;
    if (hueRoll > 0.8) dayHue = 30;
    else if (hueRoll > 0.6) dayHue = 50;
    else if (hueRoll > 0.4) dayHue = 20;
    const isTwinkle = isBig || isMed;
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3, vy: (Math.random() - 0.5) * 0.3,
      r: r,
      nightHue: nightHue,
      dayHue: dayHue,
      alpha: isBig ? 0.6 + Math.random() * 0.3 : isMed ? 0.4 + Math.random() * 0.3 : 0.2 + Math.random() * 0.3,
      twinkle: isTwinkle,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.003 + Math.random() * 0.02,
      baseVx: 0, baseVy: 0,
    });
    particles[i].baseVx = particles[i].vx;
    particles[i].baseVy = particles[i].vy;
  }

  const CONNECT_DIST = 90;

  // — 流星群 —
  const METEOR_COUNT = 5;
  const meteors = [];
  for (let i = 0; i < METEOR_COUNT; i++) { meteors.push(resetMeteor(true)); }
  function resetMeteor(randomStart) {
    return {
      x: randomStart ? Math.random() * W * 1.5 : Math.random() * W,
      y: randomStart ? Math.random() * H * 0.3 : -20,
      speed: 6 + Math.random() * 8,
      angle: 0.4 + Math.random() * 0.3,
      life: randomStart ? Math.random() * 300 : 0,
      maxLife: 250 + Math.random() * 200,
      len: 60 + Math.random() * 80,
      width: 1 + Math.random() * 1.2,
    };
  }

  function draw() {
    const day = isDay();
    ctx.clearRect(0, 0, W, H);

    // 1) 粒子
    for (const p of particles) {
      p.pulse += p.pulseSpeed;
      const hue = day ? p.dayHue : p.nightHue;
      let pulseAlpha = p.alpha;
      if (p.twinkle) pulseAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
      const light = day ? 70 : 85;

      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      if (p.r > 2) {
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
        grad.addColorStop(0, `hsla(${hue}, ${day ? 60 : 50}%, ${light}%, ${pulseAlpha})`);
        grad.addColorStop(0.3, `hsla(${hue}, ${day ? 60 : 50}%, ${light - 10}%, ${pulseAlpha * 0.4})`);
        grad.addColorStop(1, `hsla(${hue}, ${day ? 60 : 50}%, ${light - 15}%, 0)`);
        ctx.fillStyle = grad;
      } else {
        ctx.fillStyle = `hsla(${hue}, ${day ? 60 : 50}%, ${light}%, ${pulseAlpha})`;
      }
      ctx.fill();
    }

    // 2) 星座连线
    for (let i = 0; i < particles.length; i++) {
      if (particles[i].r < 1.5) continue;
      for (let j = i + 1; j < particles.length; j++) {
        if (particles[j].r < 1.5) continue;
        const dx = particles[i].x - particles[j].x, dy = particles[i].y - particles[j].y, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT_DIST) {
          const alpha = (1 - dist / CONNECT_DIST) * (day ? 0.04 : 0.08);
          const h = day ? 35 : 220;
          ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = `hsla(${h}, ${day ? 50 : 40}%, ${day ? 60 : 70}%, ${alpha})`; ctx.lineWidth = 0.4; ctx.stroke();
        }
      }
    }

    // 3) 流星
    for (const m of meteors) {
      m.life++;
      if (m.life > m.maxLife) { Object.assign(m, resetMeteor(false)); }
      const dx = Math.cos(m.angle) * m.speed;
      const dy = Math.sin(m.angle) * m.speed;
      m.x += dx; m.y += dy;
      const progress = m.life / m.maxLife;
      const trailAlpha = progress < 0.1 ? progress / 0.1 : progress > 0.8 ? 1 - (progress - 0.8) / 0.2 : 1;

      ctx.beginPath();
      ctx.moveTo(m.x, m.y);
      ctx.lineTo(m.x - dx * (m.len / m.speed), m.y - dy * (m.len / m.speed));
      const grad = ctx.createLinearGradient(m.x, m.y, m.x - dx * 8, m.y - dy * 8);
      if (day) {
        grad.addColorStop(0, `rgba(255, 200, 150, ${trailAlpha * 0.5})`);
        grad.addColorStop(1, 'rgba(255, 200, 150, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.width;
        ctx.stroke();
        ctx.beginPath(); ctx.arc(m.x, m.y, m.width * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 210, 170, ${trailAlpha * 0.6})`;
        ctx.fill();
      } else {
        grad.addColorStop(0, `rgba(200, 220, 255, ${trailAlpha * 0.6})`);
        grad.addColorStop(1, 'rgba(200, 220, 255, 0)');
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.width;
        ctx.stroke();
        ctx.beginPath(); ctx.arc(m.x, m.y, m.width * 1.2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 235, 255, ${trailAlpha * 0.8})`;
        ctx.fill();
      }
    }

    // 4) 鼠标交互
    if (mouseIn) {
      if (day) {
        const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 150);
        grad.addColorStop(0, 'rgba(255, 200, 150, 0.04)');
        grad.addColorStop(0.4, 'rgba(255, 180, 130, 0.02)');
        grad.addColorStop(1, 'rgba(255, 180, 130, 0)');
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 150, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 25, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 200, 150, 0.08)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 200, 150, 0.3)'; ctx.fill();
        for (const p of particles) {
          if (p.r < 1.2) continue;
          const dx = p.x - mouseX, dy = p.y - mouseY, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 160) {
            const alpha = (1 - dist / 160) * 0.10;
            ctx.beginPath(); ctx.moveTo(mouseX, mouseY); ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = `hsla(35, 60%, 60%, ${alpha})`; ctx.lineWidth = 0.5; ctx.stroke();
          }
        }
      } else {
        const grad = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 150);
        grad.addColorStop(0, 'rgba(80, 160, 255, 0.05)');
        grad.addColorStop(0.4, 'rgba(60, 100, 220, 0.02)');
        grad.addColorStop(1, 'rgba(40, 80, 200, 0)');
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 150, 0, Math.PI * 2); ctx.fillStyle = grad; ctx.fill();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 25, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(100, 180, 255, 0.10)'; ctx.lineWidth = 1; ctx.stroke();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(180, 220, 255, 0.4)'; ctx.fill();
        for (const p of particles) {
          if (p.r < 1.2) continue;
          const dx = p.x - mouseX, dy = p.y - mouseY, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 160) {
            const alpha = (1 - dist / 160) * 0.15;
            ctx.beginPath(); ctx.moveTo(mouseX, mouseY); ctx.lineTo(p.x, p.y);
            ctx.strokeStyle = `hsla(210, 70%, 70%, ${alpha})`; ctx.lineWidth = 0.5; ctx.stroke();
          }
        }
      }
    }

    // 5) 更新粒子
    for (const p of particles) {
      if (mouseIn) {
        const dx = p.x - mouseX, dy = p.y - mouseY, dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 180 && dist > 0.1) {
          const force = (1 - dist / 180) * 1.2;
          p.vx -= (dx / dist) * force * 0.02;
          p.vy -= (dy / dist) * force * 0.02;
        }
      }
      p.vx += (p.baseVx - p.vx) * 0.01;
      p.vy += (p.baseVy - p.vy) * 0.01;
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
      p.x = Math.max(0, Math.min(W, p.x));
      p.y = Math.max(0, Math.min(H, p.y));
    }

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<script>
  // 开场过渡控制
  (function(){
    var overlay = document.getElementById('bootOverlay');
    if(!overlay) return;
    function dismiss(){
      if(overlay.dataset.dismissed === '1') return;
      overlay.dataset.dismissed = '1';
      overlay.classList.add('hide');
      setTimeout(function(){
        if(overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 900);
    }
    setTimeout(dismiss, 3000);
  })();
</script>
