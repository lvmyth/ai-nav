<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工具导航 | AI Tools Portal</title>
<link rel="icon" href="lvmyth-ai.png">
<link rel="apple-touch-icon" href="lvmyth-ai.png">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text: #dce8f5;
    --text-secondary: #98b0cc;
    --text-muted: #5a7a9e;
    --border: rgba(80, 180, 255, 0.10);
    --primary: #66ccff;
    --primary-light: rgba(0, 150, 255, 0.10);
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    --glass-bg: rgba(60, 120, 200, 0.03);
    --glass-border: 1px solid rgba(100, 200, 255, 0.06);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #060612;
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.8s ease;
  }

  /* ===== 白天模式 ===== */
  body.day-mode {
    background: #f7f2ec;
  }
  body.day-mode,
  .day-mode {
    --text: #3a3632;
    --text-secondary: #706860;
    --text-muted: #968e86;
    --border: rgba(160, 140, 120, 0.06);
    --primary: #c88460;
    --primary-light: rgba(200, 130, 90, 0.08);
    --glass-bg: rgba(248, 240, 232, 0.25);
    --glass-border: 1px solid rgba(215, 200, 190, 0.12);
  }
  body.day-mode .header h1 {
    background: linear-gradient(135deg, #5a4a3a, #d08860, #b07850);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  body.day-mode .header p {
    opacity: 0.8;
    color: var(--text-secondary);
  }

  /* ===== 开场过渡 ===== */
  .boot-overlay {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: #fdfcfc;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    pointer-events: auto;
  }
  .boot-overlay.hide {
    animation: boot-fade-out 0.8s ease forwards;
  }
  .boot-logo {
    max-width: 220px;
    max-height: 220px;
    width: 70%;
    display: block;
  }
  .boot-brand {
    margin-top: 28px;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #3a3632;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .boot-brand .ai-blue {
    color: #4488ff;
    font-weight: 600;
  }
  @keyframes boot-fade-out {
    0%   { opacity: 1; }
    100% { opacity: 0; pointer-events: none; visibility: hidden; }
  }

  /* ===== 扑克牌桌面 ===== */
  .poker-phase {
    position: relative;
    z-index: 5;
    padding: 10px 20px 40px;
    transition: opacity 0.5s;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .poker-phase.dealt {
    justify-content: flex-start;
  }
  .poker-phase.dealt .poker-decks {
    opacity: 0.35;
    transform: scale(0.85);
  }
  .poker-phase.dealt .poker-decks:hover {
    opacity: 0.7;
    transform: scale(0.88);
  }
  .poker-phase.dealt .poker-title {
    opacity: 0;
    height: 0;
    overflow: hidden;
    margin: 0;
  }
  .poker-title {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--text-secondary);
    text-align: center;
  }
  .poker-title span { color: var(--primary); }
  .poker-decks {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
  }
  .poker-decks-left {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-align: center;
  }
  .poker-info {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  .poker-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  .update-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: #7dd3fc;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    padding: 3px 12px;
    border-radius: 20px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .poker-search-sm { margin-top: 4px; }
  .poker-search-sm-input {
    width: 200px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    background: var(--glass-bg, rgba(60,120,200,0.03));
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .poker-search-sm-input:focus { border-color: var(--primary); }
  .poker-search-sm-input::placeholder { color: var(--text-muted); opacity: 0.5; }
  .tools-search { text-align: right; margin-top: 6px; }
  .tools-search .poker-search-sm-input { width: 180px; }
  body.day-mode .poker-search-sm-input {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  .table-search {
    display: flex;
    justify-content: center;
    padding: 0 20px 10px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .table-search.show {
    opacity: 1;
    pointer-events: auto;
  }
  .table-search-input {
    display: none;
    width: 100%;
    max-width: 400px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    background: var(--glass-bg, rgba(60,120,200,0.03));
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .table-search-input.active { display: block; }
  .table-search-input:focus { border-color: var(--primary); text-align: left; }
  .table-search-input::placeholder { color: var(--text-muted); opacity: 0.5; }
  body.day-mode .table-search-input {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  .poker-deck-group {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .poker-logo {
    cursor: pointer;
    transition: transform 0.3s;
  }
  .poker-logo:hover { transform: scale(1.05); }
  .poker-logo-img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    filter: drop-shadow(0 0 20px rgba(100,160,255,0.3));
  }
  .poker-glossary-btn {
    padding: 8px 20px;
    border-radius: 20px;
    border: 1.5px solid rgba(100,180,255,0.12);
    background: rgba(60,120,200,0.06);
    color: var(--text-secondary);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    white-space: nowrap;
  }
  .poker-glossary-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
    transform: translateY(-2px);
  }
  .poker-glossary-btn:active {
    transform: scale(0.96);
  }
  body.day-mode .poker-glossary-btn {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  body.day-mode .poker-glossary-btn:hover {
    border-color: #c88460;
    color: #c88460;
    background: rgba(200,130,90,0.06);
  }
  .poker-logo-wrap {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .poker-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .poker-subtitle {
    font-size: 14px;
    color: var(--text-secondary);
    letter-spacing: 1px;
    line-height: 1.4;
  }
  .poker-search-wrap {
    position: relative;
  }
  .poker-search-input {
    width: 160px;
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    background: var(--glass-bg, rgba(60,120,200,0.03));
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .poker-search-input:focus {
    border-color: var(--primary);
  }
  .poker-search-input::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }
  body.day-mode .poker-search-input {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  .poker-search-bar {
    display: flex;
    justify-content: center;
    padding: 12px 20px 8px;
  }
  .poker-search-input-wide {
    width: 100%;
    max-width: 500px;
    padding: 10px 16px;
    border-radius: 12px;
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    background: var(--glass-bg, rgba(60,120,200,0.03));
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .poker-search-input-wide:focus {
    border-color: var(--primary);
    text-align: left;
  }
  .poker-search-input-wide::placeholder {
    color: var(--text-muted);
    opacity: 0.6;
  }
  body.day-mode .poker-search-input-wide {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  .poker-deck {
    position: relative;
    width: 200px;
    height: 280px;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 0.3s;
  }
  .poker-deck:hover { transform: translateY(-12px); }
  .poker-deck:active { transform: scale(0.96); }
  .poker-deck .pc {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    border: 1.5px solid rgba(200,200,220,0.3);
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s, box-shadow 0.3s;
    overflow: hidden;
    backface-visibility: hidden;
  }
  .poker-deck .pc:nth-child(1) { transform: rotate(-3deg); z-index: 1; }
  .poker-deck .pc:nth-child(2) { transform: rotate(2.5deg); z-index: 2; margin-left: -2px; margin-top: -2px; }
  .poker-deck .pc:nth-child(3) { transform: rotate(-1.5deg); z-index: 3; margin-left: -4px; margin-top: -4px; }
  .poker-deck .pc:nth-child(4) { transform: rotate(0.5deg); z-index: 4; margin-left: -6px; margin-top: -6px; }
  .poker-deck .pc:last-child {
    transform: rotate(0deg);
    z-index: 5;
    margin-left: -8px;
    margin-top: -8px;
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border-color: rgba(100,150,255,0.15);
  }
  .poker-deck .pc-back {
    position: absolute;
    inset: 12px;
    border-radius: 8px;
    background: repeating-linear-gradient(
      45deg,
      rgba(100,130,255,0.08) 0px, rgba(100,130,255,0.08) 8px,
      transparent 8px, transparent 16px
    );
  }
  .poker-deck .pc-back::after {
    content: '';
    position: absolute;
    inset: 20px;
    border-radius: 6px;
    border: 2px solid rgba(100,160,255,0.12);
    background: radial-gradient(circle at center, rgba(100,160,255,0.05) 0%, transparent 70%);
  }
  .deck-label {
    position: relative;
    z-index: 6;
    color: #dce8f5;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    width: 100%;
  }
  .deck-sub {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 6px;
    font-weight: 400;
    letter-spacing: 1px;
  }
  .deck-count {
    position: absolute;
    bottom: 14px;
    right: 14px;
    z-index: 6;
    font-size: 15px;
    font-weight: 600;
    color: rgba(180,220,255,0.8);
    letter-spacing: 1px;
    background: rgba(0,0,0,0.3);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .deck-suit {
    font-size: 48px;
    position: absolute;
    top: 16px;
    left: 18px;
    z-index: 6;
    opacity: 0.3;
  }
  body.day-mode .poker-deck .pc:last-child {
    background: linear-gradient(145deg, #e8e0d8, #f0e8e0);
    border-color: rgba(180,160,140,0.2);
  }
  body.day-mode .deck-label { color: #5a4a3a; text-shadow: none; }
  body.day-mode .deck-count { color: rgba(90,74,58,0.4); }
  body.day-mode .poker-deck .pc-back {
    background: repeating-linear-gradient(
      45deg,
      rgba(180,160,140,0.06) 0px, rgba(180,160,140,0.06) 8px,
      transparent 8px, transparent 16px
    );
  }
  body.day-mode .poker-deck .pc-back::after {
    border-color: rgba(180,160,140,0.1);
    background: radial-gradient(circle at center, rgba(180,160,140,0.03) 0%, transparent 70%);
  }

  /* ===== 牌桌桌面 ===== */
  .table-felt {
    position: relative;
    min-height: 0;
    margin-top: 20px;
    padding: 20px;
    border-radius: 16px;
    background: radial-gradient(ellipse at center, rgba(30,80,60,0.3) 0%, transparent 70%);
    border: 1px solid rgba(80,180,140,0.06);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 20px;
    transition: min-height 0.6s;
  }
  .table-felt.has-cards {
    min-height: 300px;
  }
  .table-felt:empty {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .table-felt:empty::after {
    content: '🃏 点击上方牌叠发牌';
    font-size: 18px;
    color: var(--text-muted);
    letter-spacing: 2px;
    opacity: 0.4;
  }
  .felt-loadmore {
    grid-column: 1 / -1;
    display: block;
    margin: 6px auto 4px;
    padding: 12px 30px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    color: #cfe0ff;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s ease;
  }
  .felt-loadmore:hover { background: rgba(255,255,255,0.12); }
  body.day-mode .table-felt {
    background: radial-gradient(ellipse at center, rgba(180,200,160,0.15) 0%, transparent 70%);
    border-color: rgba(160,180,140,0.08);
  }

  /* ===== 分类标签栏 ===== */
  .cat-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 16px 0 8px;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  .cat-bar.show { opacity: 1; pointer-events: auto; }
  .cat-bar .cb-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    background: var(--glass-bg, rgba(60,120,200,0.03));
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .cat-bar .cb-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }
  .cat-bar .cb-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  body.day-mode .cat-bar .cb-btn {
    background: rgba(248,240,232,0.3);
    border-color: rgba(215,200,190,0.1);
  }
  body.day-mode .cat-bar .cb-btn:hover {
    border-color: #c88460;
    color: #c88460;
    background: rgba(200,130,90,0.06);
  }
  body.day-mode .cat-bar .cb-btn.active {
    background: #c88460;
    color: #fff;
    border-color: #c88460;
  }

  /* ===== 细粒度标签行（工具桌/术语桌统一，从 tags 字段聚合） ===== */
  .fine-tag-bar {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding: 0 0 12px; justify-content: center;
    max-width: 1080px; margin: 0 auto;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .fine-tag-bar.show { opacity: 1; pointer-events: auto; }
  .fine-tag-bar .ft-btn {
    font-size: 12px; padding: 4px 10px; border-radius: 14px; cursor: pointer;
    background: var(--glass-bg, rgba(60,120,200,0.05));
    color: var(--text-secondary);
    border: 1px solid var(--border, rgba(80,180,255,0.18));
    transition: all .18s; font-family: inherit; line-height: 1.4;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .fine-tag-bar .ft-btn:hover { border-color: var(--primary); color: var(--primary); }
  .fine-tag-bar .ft-btn.active {
    background: var(--primary); color: #fff; border-color: var(--primary);
  }
  .fine-tag-bar .ft-count { font-size: 10px; opacity: .75; }
  .fine-tag-bar .ft-btn.active .ft-count { opacity: .9; }
  body.day-mode .fine-tag-bar .ft-btn {
    background: rgba(248,240,232,0.35); border-color: rgba(215,200,190,0.18);
  }
  body.day-mode .fine-tag-bar .ft-btn:hover { border-color: #c88460; color: #c88460; }
  body.day-mode .fine-tag-bar .ft-btn.active { background: #c88460; color: #fff; border-color: #c88460; }

  /* ===== 牌桌卡片 ===== */
  .table-card {
    width: 280px;
    min-height: 240px;
    border-radius: 14px;
    background: var(--glass-bg, rgba(60,120,200,0.03));
    border: var(--glass-border, 1px solid rgba(100,200,255,0.06));
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    animation: card-land 0.4s ease forwards;
  }
  .table-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.15);
    border-color: rgba(100,200,255,0.2);
  }
  @keyframes card-land {
    0%   { opacity: 0; transform: translateY(-30px) scale(0.8); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .table-card .tc-icon { font-size: 32px; }
  .table-card .tc-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .table-card .tc-vendor { font-size: 13px; color: var(--text-secondary); }
  .table-card .tc-desc {
    font-size: 12.5px; color: var(--text-muted);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .table-card .tc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: auto;
    max-height: 40px;
    overflow: hidden;
  }
  .table-card .tc-tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    background: rgba(100,180,255,0.12);
    color: var(--primary);
    border: 1px solid rgba(100,180,255,0.15);
    font-weight: 500;
  }
  body.day-mode .table-card .tc-tag {
    background: rgba(200,130,90,0.08);
    color: #b87850;
    border-color: rgba(200,130,90,0.1);
  }
  body.day-mode .table-card {
    background: rgba(248,240,232,0.6);
    border-color: rgba(215,200,190,0.15);
  }

  /* ===== 工具操作栏（排序/收藏/最近/标签筛选） ===== */
  .table-toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 10px 0 4px; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s;
  }
  .table-toolbar.show { opacity: 1; pointer-events: auto; }
  .sort-select {
    padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer;
    background: var(--glass-bg, rgba(60,120,200,0.03)); color: var(--text-secondary);
    border: 1px solid var(--border, rgba(80,180,255,0.1)); font-family: inherit;
  }
  .view-toggle {
    padding: 6px 14px; border-radius: 20px; font-size: 13px; cursor: pointer;
    background: var(--glass-bg, rgba(60,120,200,0.03)); color: var(--text-secondary);
    border: 1px solid var(--border, rgba(80,180,255,0.1)); font-family: inherit; transition: all .2s;
  }
  .view-toggle:hover { border-color: var(--primary); color: var(--primary); }
  .view-toggle.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  /* 当前类型下没有收藏/最近记录时弱化显示，避免"有数字点开却空"的错觉 */
  .view-toggle.empty { opacity: .5; }
  .table-count { font-size: 12px; color: var(--text-muted); margin-left: 4px; }
  .felt-empty {
    width: 100%; text-align: center; padding: 60px 20px; font-size: 14px;
    color: var(--text-muted); grid-column: 1 / -1;
  }

  .tag-filter-bar {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0 12px; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.5s; max-width: 1000px; margin: 0 auto;
  }
  .tag-filter-bar.show { opacity: 1; pointer-events: auto; }
  .tf-tag {
    font-size: 11px; padding: 3px 8px 3px 10px; border-radius: 14px; cursor: pointer;
    background: rgba(100,180,255,0.16); color: var(--primary);
    border: 1px solid rgba(100,180,255,0.28); font-weight: 500; transition: all .2s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .tf-tag:hover { background: rgba(255,120,120,0.18); border-color: rgba(255,120,120,0.4); color: #ff8a8a; }
  .tf-tag .rm { font-size: 12px; opacity: .8; }
  .tf-label { font-size: 11px; color: var(--text-muted); align-self: center; margin-right: 2px; }
  .table-card .tc-tag.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

  /* 卡片收藏星标 + 可点击标签 */
  .table-card { position: relative; }
  .table-card .tc-star {
    position: absolute; top: 10px; right: 10px; width: 28px; height: 28px;
    border: none; background: rgba(255,255,255,0.08); border-radius: 50%;
    cursor: pointer; font-size: 15px; line-height: 1; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; transition: all .2s; z-index: 3;
  }
  .table-card .tc-star:hover { background: rgba(255,210,90,0.18); }
  .table-card .tc-star.active { color: #ffcf4d; background: rgba(255,207,77,0.16); }
  .table-card .tc-tag.clickable { cursor: pointer; }
  .table-card .tc-tag.clickable:hover { background: rgba(100,180,255,0.24); }
  /* 热度徽标（仅在「按热度」排序时显示） */
  .table-card .tc-hot {
    position: absolute; top: 10px; left: 10px; z-index: 3;
    font-size: 11px; font-weight: 600; line-height: 1; color: #ff9d3c;
    background: rgba(255,141,60,0.14); border: 1px solid rgba(255,141,60,0.28);
    border-radius: 10px; padding: 3px 7px; letter-spacing: .3px;
  }
  body.day-mode .table-card .tc-hot { color: #d97706; background: rgba(217,119,6,0.1); border-color: rgba(217,119,6,0.25); }

  /* ===== 发牌动画 ===== */
  .dealing-card {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    border-radius: 12px;
    background: var(--bg-card, #1a1a2e);
    border: 1px solid var(--border, rgba(80,180,255,0.1));
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--text, #dce8f5);
    padding: 12px;
  }
  .dealing-card .dc-icon { font-size: 24px; margin-bottom: 4px; }
  .dealing-card .dc-name { font-size: 12px; font-weight: 500; text-align: center; line-height: 1.2; }
  .dealing-card .dc-vendor { font-size: 10px; opacity: 0.6; margin-top: 2px; }
  .dealing-card .dc-rank {
    position: absolute;
    top: 6px;
    left: 8px;
    font-size: 11px;
    font-weight: 600;
    opacity: 0.5;
  }

  /* ===== 原有主内容（永久隐藏，仅当备用） ===== */
  .main-content {
    display: none;
  }

  /* ===== Canvas 背景 ===== */
  #bg-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ===== 星空 ===== */
  .starfield {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1.5px 1.5px at 18% 38%, rgba(200,230,255,0.6), transparent),
      radial-gradient(1px 1px at 28% 5%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 35% 72%, rgba(180,220,255,0.8), transparent),
      radial-gradient(1px 1px at 42% 45%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.8px 1.8px at 50% 18%, rgba(200,210,255,0.7), transparent),
      radial-gradient(1px 1px at 58% 80%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.2px 1.2px at 65% 30%, rgba(180,200,255,0.6), transparent),
      radial-gradient(1px 1px at 73% 55%, rgba(255,255,255,0.4), transparent),
      radial-gradient(2.2px 2.2px at 80% 85%, rgba(200,230,255,0.9), transparent),
      radial-gradient(1px 1px at 88% 22%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 95% 68%, rgba(200,220,255,0.6), transparent),
      radial-gradient(1px 1px at 3% 92%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.8px 1.8px at 48% 95%, rgba(180,210,255,0.7), transparent),
      radial-gradient(1px 1px at 92% 4%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.3px 1.3px at 22% 50%, rgba(200,230,255,0.5), transparent);
    background-size: 250px 250px;
    mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 75%);
  }

  /* ===== 星云雾 ===== */
  .nebula-mist {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse 90% 60% at 15% 30%, rgba(60, 80, 200, 0.04), transparent),
      radial-gradient(ellipse 70% 50% at 80% 70%, rgba(130, 40, 200, 0.03), transparent),
      radial-gradient(ellipse 50% 40% at 50% 15%, rgba(0, 150, 200, 0.02), transparent);
  }

  /* ===== 装饰光晕 ===== */
  .glow {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 1;
  }
  .glow-1 {
    width: 650px; height: 650px;
    background: radial-gradient(circle, rgba(60, 120, 255, 0.15), transparent 70%);
    top: -18%; left: -12%;
    animation: float-glow 18s ease-in-out infinite alternate;
  }
  .glow-2 {
    width: 550px; height: 550px;
    background: radial-gradient(circle, rgba(150, 60, 220, 0.10), transparent 70%);
    bottom: -15%; right: -10%;
    animation: float-glow 15s ease-in-out infinite alternate-reverse;
  }
  .glow-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0, 200, 220, 0.06), transparent 70%);
    top: 50%; left: 50%;
    animation: pulse-glow 13s ease-in-out infinite alternate;
  }
  @keyframes float-glow {
    0%   { transform: translate(0, 0) scale(1); }
    100% { transform: translate(100px, 70px) scale(1.2); }
  }
  @keyframes pulse-glow {
    0%   { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
    100% { transform: translate(-50%, -50%) scale(1.3);  opacity: 1; }
  }

  /* ===== Header ===== */
  .header {
    position: relative;
    z-index: 2;
    padding: 40px 24px 50px;
    text-align: center;
    color: #fff;
  }
  .header-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .header-logo { flex-shrink: 0; }
  .header-logo a { text-decoration: none; display: block; cursor: pointer; }
  .header-logo-img { width: 56px; height: 56px; border-radius: 14px; display: block; border: 1px solid rgba(255,255,255,0.08); }
  @media (max-width: 600px) {
    .header-content { flex-direction: column; gap: 10px; }
    .header-logo-img { width: 44px; height: 44px; }
  }
  .header h1 {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #dce8f5, #4488cc, #6644cc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 16px;
    opacity: 0.6;
    max-width: 500px;
    margin: 0 auto;
  }

  /* ===== Logo Modal ===== */
  .logo-modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
  }
  .logo-modal-overlay.active { display: flex; }
  .logo-modal {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 20px;
    padding: 36px 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: modalIn 0.25s ease;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .logo-modal-icon {
    width: 64px; height: 64px; border-radius: 14px;
    object-fit: cover; margin: 0 auto 16px; display: block;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .logo-modal-title { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .logo-modal-subtitle { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; }
  .logo-modal-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: rgba(60, 140, 255, 0.10);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: #fff;
    padding: 12px 28px;
    border-radius: 10px;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    border: 1px solid rgba(60, 140, 255, 0.15);
    transition: var(--transition);
  }
  .logo-modal-btn:hover { background: rgba(60, 140, 255, 0.18); border-color: rgba(60, 140, 255, 0.3); }
  .logo-modal-close { margin-top: 16px; font-size: 13px; color: var(--text-muted); }

  /* ===== News Ticker ===== */
  .news-ticker-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    overflow: hidden;
    height: 40px;
    line-height: 40px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .news-ticker-inner { display: flex; white-space: nowrap; overflow: hidden; }
  .news-ticker-track { display: inline-flex; gap: 40px; animation: scroll-news 60s linear infinite; }
  .news-ticker-wrap:hover .news-ticker-track { animation-play-state: paused; }
  .news-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--text-secondary);
    font-size: 13px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .news-item:hover { color: var(--primary); }
  .news-badge {
    background: rgba(60, 140, 255, 0.08);
    border-radius: 4px;
    padding: 1px 8px;
    font-size: 11px;
    font-weight: 600;
    color: #66ccff;
    flex-shrink: 0;
  }
  .news-label { font-weight: 400; }
  .news-loader {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 20px;
  }
  .news-loader .dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    opacity: 0.4;
    animation: dot-pulse 1.4s ease-in-out infinite;
  }
  .news-loader .dot:nth-child(2) { animation-delay: 0.2s; }
  .news-loader .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-pulse {
    0%,80%,100% { opacity: 0.3; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }
  @keyframes scroll-news {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* ===== Stats Bar ===== */
  .stats-bar {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: 40px;
    padding: 20px 24px;
    margin-top: -20px;
    border-radius: var(--radius);
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
  }
  .stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

  /* ===== Container ===== */
  .container {
    position: relative;
    z-index: 2;
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 60px;
  }

  /* ===== Search ===== */
  .search-wrapper { display: flex; gap: 12px; margin-bottom: 28px; }
  .search-box { flex: 1; position: relative; }
  .search-box svg {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 20px; color: var(--text-muted);
  }
  .search-input {
    width: 100%;
    height: 50px;
    padding: 0 48px 0 48px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    outline: none;
    transition: var(--transition);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    color: var(--text);
  }
  .search-input::placeholder { color: var(--text-muted); }
  .search-input:focus {
    border-color: rgba(60, 140, 255, 0.25);
    box-shadow: 0 0 0 4px rgba(60, 140, 255, 0.06);
    background: rgba(255,255,255,0.06);
  }
  .search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px;
    border: none;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: var(--text-secondary);
    transition: var(--transition);
  }
  .search-clear.visible { display: flex; }
  .search-clear:hover { background: rgba(255,255,255,0.1); }

  /* ===== Mode Switcher ===== */
  .mode-switcher {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 4px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .mode-btn {
    flex: 1;
    padding: 10px 24px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    background: transparent;
    color: var(--text-muted);
  }
  .mode-btn.active {
    background: rgba(60, 140, 255, 0.08);
    color: #66ccff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
  .mode-btn:hover:not(.active) { color: var(--text-secondary); }

  /* ===== Categories ===== */
  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }
  .cat-btn {
    padding: 8px 20px;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.04);
  }
  .cat-btn:hover {
    color: #c0d8ff;
    background: rgba(255,255,255,0.06);
    border-color: rgba(100, 180, 255, 0.10);
  }
  .cat-btn.active {
    background: rgba(60, 140, 255, 0.08);
    color: #66ccff;
    border-color: rgba(60, 140, 255, 0.15);
  }
  .cat-count { font-size: 11px; opacity: 0.7; margin-left: 4px; }

  /* ===== Filter Row ===== */
  .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .oss-btn {
    padding: 6px 16px;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: var(--text-muted);
  }
  .oss-btn:hover { border-color: rgba(60,140,255,0.15); color: #c0d8ff; }
  .oss-btn.active {
    background: rgba(60, 140, 255, 0.08);
    border-color: rgba(60, 140, 255, 0.18);
    color: #66ccff;
  }

  /* ===== Result Info ===== */
  .result-info {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
    display: none;
  }
  .result-info.visible { display: block; }

  /* ===== Tool Grid ===== */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  .tool-card {
    border-radius: var(--radius);
    padding: 22px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow 0.4s ease, border-color 0.4s ease;
    background: rgba(255,255,255,0.035);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .tool-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--card-accent, var(--primary)), transparent);
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .tool-card::after {
    content: '';
    position: absolute;
    bottom: 24px; right: 18px;
    width: 32px; height: 32px;
    border-right: 1.5px solid rgba(255,255,255,0.06);
    border-bottom: 1.5px solid rgba(255,255,255,0.06);
    opacity: 0.3;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .tool-card:hover {
    transform: translateY(-6px) scale(1.01);
    border-color: rgba(60, 140, 255, 0.2);
    box-shadow: 0 16px 40px rgba(0,0,0,0.3), 0 0 30px rgba(60,140,255,0.03);
  }
  .tool-card:hover::before { opacity: 1; }
  .tool-card:hover::after { opacity: 0.6; }

  .tool-card.glossary {
    cursor: default;
  }
  .tool-card.glossary .card-desc {
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  .card-top {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .tool-logo { width: 26px; height: 26px; object-fit: contain; border-radius: 6px; display: inline-block; vertical-align: middle; background: rgba(255,255,255,.06); padding: 2px; }
  .dc-icon .tool-logo { width: 30px; height: 30px; }
  .tc-icon .tool-logo { width: 34px; height: 34px; border-radius: 8px; }
  .term-modal-icon .tool-logo { width: 52px; height: 52px; border-radius: 10px; }
  .card-icon .tool-logo { width: 38px; height: 38px; border-radius: 8px; }
  body.day-mode .tool-logo { background: rgba(0,0,0,.05); }
  .card-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: rgba(60, 140, 255, 0.06);
    border: 1px solid rgba(60, 140, 255, 0.08);
    transition: all 0.3s ease;
  }
  .tool-card:hover .card-icon {
    background: rgba(60, 140, 255, 0.10);
    border-color: rgba(60, 140, 255, 0.15);
    box-shadow: 0 0 16px rgba(60,140,255,0.05);
  }
  .card-info { flex: 1; min-width: 0; }
  .card-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-vendor {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    background: rgba(255,255,255,0.04);
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;

<script>
// ==================== 扑克牌发牌逻辑 ====================
var dealtRegion = null;
var isDealing = false;
var audioCtx = null;

// 音效：发牌（高频短促下滑）
function playDealSound() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.15);
  } catch(e){}
}

// 音效：收牌（低频短促上升）
function playCollectSound() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.18);
  } catch(e){}
}

function dealCards(region) {
  if(isDealing) return;
  // 如果桌上已经是这套牌，收牌（带动画）
  if(dealtRegion === region) {
    collectCards(region);
    return;
  }

  var tools;
  if(region === 'glossary') {
    tools = TOOLS.filter(function(t){ return t.cat === 'glossary'; });
  } else {
    tools = TOOLS.filter(function(t){ return t.region === region && t.cat !== 'glossary'; });
  }
  if(tools.length === 0) return;

  // AI术语：走通用飞牌流程(从 AI 术语按钮起飞),飞牌动画仅 30 张,牌桌渲染全部术语
  // (totalCards 限制在下方,无需截断 tools)

  isDealing = true;
  dealtRegion = region;

  // 获取飞牌起点
  var deck = document.querySelector('.poker-deck[data-region="'+region+'"]');
  var deckCX, deckCY;
  if(deck){
    var deckRect = deck.getBoundingClientRect();
    deckCX = deckRect.left + deckRect.width/2;
    deckCY = deckRect.top + deckRect.height/2;
  } else {
    var btn = document.getElementById('glossaryBtn');
    if(btn){
      var btnRect = btn.getBoundingClientRect();
      deckCX = btnRect.left + btnRect.width/2;
      deckCY = btnRect.top + btnRect.height/2;
    } else {
      deckCX = window.innerWidth/2;
      deckCY = window.innerHeight/2;
    }
  }

  // 清空桌面旧牌（如果有）
  var felt = document.getElementById('tableFelt');
  felt.innerHTML = '';

  // 设置区域筛选
  var regionBtns = document.querySelectorAll('.region-btn');
  regionBtns.forEach(function(b){ b.classList.remove('active'); });
  regionBtns.forEach(function(b){
    if(b.getAttribute('data-region') === region) b.classList.add('active');
  });

  // 标记已发牌
  playDealSound();
  document.getElementById('pokerPhase').classList.add('dealt');
  // 显示对应搜索栏
  document.getElementById('tableSearch').classList.add('show');
  if(region === 'glossary'){
    document.getElementById('searchGlossary').classList.add('active');
    document.getElementById('searchTools').classList.remove('active');
  } else {
    document.getElementById('searchTools').classList.add('active');
    document.getElementById('searchGlossary').classList.remove('active');
  }

  // 创建飞牌 — 扇形散开效果
  var duration = 500;
  var delayStep = 25;
  var maxDelay = Math.min(tools.length * delayStep, 1800);
  var totalCards = Math.min(tools.length, 30); // 最多飞30张

  for(var i = 0; i < totalCards; i++){
    var t = tools[i];
    (function(idx, tool){
      var el = document.createElement('div');
      el.className = 'dealing-card';
      el.innerHTML = '<div class="dc-icon">'+iconHtml(tool.icon,'🔧')+'</div><div class="dc-name">'+tool.name+'</div>';
      el.style.width = '90px';
      el.style.height = '126px';
      el.style.left = (deckCX - 45)+'px';
      el.style.top = (deckCY - 63)+'px';
      el.style.transform = 'scale(0.2)';
      el.style.opacity = '0';
      document.body.appendChild(el);

      // 扇形散开角度
      var angle = -40 + (idx / Math.max(totalCards-1, 1)) * 80;
      var rad = angle * Math.PI / 180;
      var dist = 250 + Math.random() * 200;
      var tx = deckCX + Math.sin(rad) * dist - 45;
      var ty = deckCY + Math.cos(rad) * dist * 0.6 - 63;
      var rot = angle + (Math.random() * 10 - 5);

      setTimeout(function(){
        el.style.transition = 'all '+duration+'ms cubic-bezier(0.34, 1.56, 0.64, 1)';
        el.style.opacity = '1';
        el.style.left = tx+'px';
        el.style.top = ty+'px';
        el.style.transform = 'rotate('+rot+'deg) scale(1)';
      }, idx * delayStep);

      setTimeout(function(){
        el.style.transition = 'opacity 0.3s';
        el.style.opacity = '0';
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 350);
      }, idx * delayStep + duration + 400);
    })(i, t);
  }

  // 发牌完成：渲染卡片到牌桌
  var totalAnimTime = maxDelay + duration + 800;
  setTimeout(function(){
    var felt = document.getElementById('tableFelt');
    felt.innerHTML = '';

    // 初始化筛选状态（避免上一次筛选残留）
    curTools = tools; curRegion = region;
    selCats = []; selTags = []; ossOnly = false; favOnly = false; sortMode = 'default'; searchQ = '';
    var st0 = document.getElementById('searchTools'); if(st0) st0.value = '';
    var sg0 = document.getElementById('searchGlossary'); if(sg0) sg0.value = '';
    document.getElementById('tableToolbar').classList.add('show');

    // 构建分类筛选栏 + 细标签行 + 刷新已选标签显示
    buildCategoryBar(tools, felt, region);
    buildFineTagBar(tools, region);
    updateSelectedTagsUI();

    // 统一筛选渲染（收藏计数按当前牌桌类型显示）
    applyTableFilters();
    updateFavCount();

    isDealing = false;
  }, totalAnimTime);
}

// 收牌动画：卡片飞回牌叠
function collectCards(region) {
  playCollectSound();
  var felt = document.getElementById('tableFelt');
  var cards = felt.querySelectorAll('.table-card');
  // 收牌起点:优先找牌堆,术语则用 AI 术语按钮
  var deck = document.querySelector('.poker-deck[data-region="'+region+'"]');
  if(region === 'glossary') {
    deck = document.getElementById('glossaryBtn');
  }
  if(!deck || cards.length === 0) {
    // 没有卡片直接重置
    felt.innerHTML = '';
    felt.classList.remove('has-cards');
    document.getElementById('pokerPhase').classList.remove('dealt');
    document.getElementById('catBar').className = 'cat-bar';
    document.getElementById('tableSearch').classList.remove('show');
    resetTableFilterUI();
    dealtRegion = null;
    return;
  }

  var deckRect = deck.getBoundingClientRect();
  var dCX = deckRect.left + deckRect.width/2 - 45;
  var dCY = deckRect.top + deckRect.height/2 - 63;

  cards.forEach(function(card, i){
    var rect = card.getBoundingClientRect();
    var clone = card.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.left = rect.left + 'px';
    clone.style.top = rect.top + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.margin = '0';
    clone.style.animation = 'none';
    clone.style.opacity = '1';
    clone.style.pointerEvents = 'none';
    clone.style.zIndex = '9999';
    document.body.appendChild(clone);

    // 卡片原样隐藏
    card.style.visibility = 'hidden';

    // 延时飞回
    setTimeout(function(){
      clone.style.transition = 'all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1)';
      clone.style.left = dCX + 'px';
      clone.style.top = dCY + 'px';
      clone.style.transform = 'scale(0.2) rotate('+(Math.random()*20-10)+'deg)';
      clone.style.opacity = '0';
    }, i * 30);

    setTimeout(function(){
      if(clone.parentNode) clone.parentNode.removeChild(clone);
    }, i * 30 + 800);
  });

  // 全部收完后重置
  var maxWait = Math.min(cards.length, 30) * 30 + 900;
  setTimeout(function(){
    felt.innerHTML = '';
    felt.classList.remove('has-cards');
    document.getElementById('pokerPhase').classList.remove('dealt');
    document.getElementById('catBar').className = 'cat-bar';
    document.getElementById('tableSearch').classList.remove('show');
    resetTableFilterUI();
    dealtRegion = null;
  }, maxWait);
}

// 收牌后清掉桌面相关的筛选 UI（工具栏、细标签行、已选标签区）+ 清空搜索框
function resetTableFilterUI(){
  ['tableToolbar','tagFilterBar','fineTagBar'].forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.classList.remove('show');
    if(id === 'tagFilterBar' || id === 'fineTagBar') el.innerHTML = '';
  });
  var st = document.getElementById('searchTools'); if(st) st.value = '';
  var sg = document.getElementById('searchGlossary'); if(sg) sg.value = '';
}

// 渲染卡片到桌面
function renderCardsToFelt(tools, felt, animate, limit) {
  felt.innerHTML = '';
  felt.classList.add('has-cards');
  var step = animate === false ? 0 : 15;
  var cap = (typeof limit === 'number' && limit > 0) ? limit : tools.length;
  var shown = tools.slice(0, cap);
  if(!shown.length){
    felt.innerHTML = '<div class="felt-empty">没有符合条件的内容，试试清除筛选 ✕</div>';
    return;
  }
  shown.forEach(function(t, i){
    var make = function(){
      var card = document.createElement('div');
      card.className = 'table-card';
      var isFav = favSets[typeOf(t.id)].has(t.id);
      var star = '<button class="tc-star' + (isFav ? ' active' : '') + '" data-id="' + t.id + '" title="收藏">' + (isFav ? '★' : '☆') + '</button>';
      // 术语桌卡片显示受控主题（更干净）；工具桌保持原自由标签
      var allTags = (curRegion === 'glossary' && t.topics && t.topics.length)
        ? t.topics.slice(0) : (t.tags ? t.tags.slice(0) : []);
      if(curRegion === 'glossary' && t.flags && t.flags.indexOf('开源') !== -1
         && allTags.indexOf('开源') === -1) allTags.push('开源');
      var hasOS = false;
      var osIdx = allTags.indexOf('开源');
      if(osIdx !== -1){ hasOS = true; allTags.splice(osIdx, 1); }
      var showTags = allTags.slice(0, hasOS ? 4 : 5);
      if(hasOS) showTags.push('开源');
      var tags = showTags.length ? '<div class="tc-tags">' +
        showTags.map(function(tag){
          var sel = selTags.indexOf(tag) !== -1;
          return '<span class="tc-tag clickable' + (sel ? ' selected' : '') + '" data-tag="' + tag + '" title="点击按「' + tag + '」筛选">' + tag + '</span>';
        }).join('') +
        '</div>' : '';

      // 按热度排序时展示使用次数徽标
      var hotBadge = '';
      if(sortMode === 'hot'){
        var hc = hotOf(typeOf(t.id), t.id);
        if(hc > 0) hotBadge = '<span class="tc-hot" title="本设备已打开 ' + hc + ' 次">🔥 ' + hc + '</span>';
      }

      card.innerHTML =
        star +
        hotBadge +
        '<div class="tc-icon">' + iconHtml(t.icon, '🔧') + '</div>' +
        '<div class="tc-name">' + t.name + '</div>' +
        '<div class="tc-vendor">' + t.vendor + '</div>' +
        '<div class="tc-desc">' + (t.desc || '').substring(0, 180) + '</div>' +
        tags;

      card.style.cursor = 'pointer';
      card.onclick = function(e){
        var starEl = e.target.closest('.tc-star');
        if(starEl){ toggleFav(starEl.dataset.id); return; }
        var tagEl = e.target.closest('.tc-tag');
        if(tagEl){ toggleTagFilter(tagEl.dataset.tag); return; }
        showTermModal(t);
      };
      felt.appendChild(card);
    };
    if(step === 0) make(); else setTimeout(make, i * step);
  });
  // 分页：还有更多则显示「加载更多」按钮（点击 + 滚动自动加载）
  if(tools.length > cap){
    var more = document.createElement('button');
    more.type = 'button';
    more.className = 'felt-loadmore';
    more.textContent = '加载更多（剩 ' + (tools.length - cap) + '）';
    more.addEventListener('click', feltLoadMore);
    felt.appendChild(more);
    setupFeltInfinite(more);
  }
}

// 显示术语详情弹窗
function showTermModal(t) {
  bumpHot(t.id); // 每次打开卡片即记一次使用次数（本地热度）
  document.getElementById('tmIcon').innerHTML = iconHtml(t.icon, '📖');
  document.getElementById('tmName').textContent = t.name;
  document.getElementById('tmVendor').textContent = t.vendor || '';
  document.getElementById('tmDesc').textContent = t.desc || '';
  var tagsHtml = '';
  if(t.tags && t.tags.length){
    tagsHtml = t.tags.map(function(tag){ return '<span class="tm-tag">'+tag+'</span>'; }).join('');
  }
  document.getElementById('tmTags').innerHTML = tagsHtml;
  // 前往使用按钮
  var btn = document.getElementById('tmBtn');
  if(t.url && t.cat !== 'glossary') {
    btn.href = t.url;
    btn.className = 'term-modal-btn';
  } else {
    btn.className = 'term-modal-btn hide';
  }
  document.getElementById('termModal').classList.add('show');
}
function closeTermModal() {
  document.getElementById('termModal').classList.remove('show');
}
// 按ESC关闭弹窗
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape') closeTermModal();
});

// 分类筛选桌上卡片（支持多选叠加）
function filterTableCards(catId) {
  if(catId === 'all') {
    selCats = [];
  } else {
    var idx = selCats.indexOf(catId);
    if(idx === -1) selCats.push(catId); else selCats.splice(idx, 1);
  }
  document.querySelectorAll('#catBar .cb-btn').forEach(function(b){
    if(!b.dataset.cat) return;
    if(b.dataset.cat === 'all') b.classList.toggle('active', selCats.length === 0);
    else b.classList.toggle('active', selCats.indexOf(b.dataset.cat) !== -1);
  });
  applyTableFilters();
}

// 构建分类栏：术语桌与工具桌统一排版，只显示「全部」一个入口，
// 更细的筛选统一走下方 .fine-tag-bar（从各自 tags 字段聚合的细粒度标签）。
function buildCategoryBar(tools, felt, region) {
  var catBar = document.getElementById('catBar');
  catBar.innerHTML = '';
  catBar.className = 'cat-bar show';

  var allLabel = (region === 'glossary') ? '📖 全部术语' : '🃏 全部';
  var allBtn = document.createElement('button');
  allBtn.className = 'cb-btn active';
  allBtn.dataset.cat = 'all';
  allBtn.textContent = allLabel + ' ('+tools.length+')';
  allBtn.onclick = function(){ filterTableCards.call(this, 'all', tools, felt); };
  catBar.appendChild(allBtn);
}

// 页面加载完成后计算牌叠数量

function iconHtml(icon, fallback) {
  var fb = fallback || '🔧';
  if (!icon) return fb;
  if (icon.indexOf('images/') === 0 || icon.indexOf('http') === 0) {
    var safeFb = fb.replace(/'/g, "\\'");

// ===== 站点健康徽标：异步读取 status.json（本地 file:// 打开时静默隐藏） =====
// 两处互补：头部 .poker-info（初始可见）、工具栏 .table-toolbar（发牌后可见）
(function(){
  var els = document.querySelectorAll('[data-health]');
  if(!els.length) return;
  function hide(){ for(var i=0;i<els.length;i++) els[i].style.display='none'; }
  if(typeof fetch !== 'function'){ hide(); return; }
  fetch('status.json', {cache:'no-cache'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(s){
      if(!s || !s.status){ hide(); return; }
      var st = s.status;
      var cls = st==='ok' ? 'ok' : (st==='partial' ? 'warn' : 'bad');
      var label = st==='ok' ? '● 正常' : (st==='partial' ? '● 部分完成' : '● 异常');
      // 日期已由上方「🕒 更新于」徽标承担：同一天只显示时刻，跨天才补「月-日」，避免两处重复同一日期
      var runDate = String(s.lastRun || '').slice(0,10);
      var runTime = String(s.lastRun || '').slice(11,16);
      var stamp = runTime ? (runDate && runDate !== NAV_UPDATE_DATE ? runDate.slice(5) + ' ' + runTime : runTime) : '';
      var text = label + ' · ' + (s.tools || '?') + ' 条' + (stamp ? ' · ' + stamp : '');
      var f = s.fields || {};
      var tip = [
        '状态：' + st,
        '最后运行：' + (s.lastRun || '未知'),
        '说明：' + (s.message || '无'),
        '本次新增：' + (s.added || 0),
        '条目总数：' + (s.tools || '?') + '（重复 id：' + (s.duplicateIds || 0) + '）',
        '字段覆盖：release ' + (f.release||0) + ' / pricing ' + (f.pricing||0)
          + ' / cn ' + (f.cn||0) + ' / api ' + (f.api||0),
        '更新日期：' + (s.date || '未知'),
        s.failedStep ? '失败步骤：' + s.failedStep : ''
      ].filter(Boolean).join('\n');
      for(var i=0;i<els.length;i++){
        els[i].className = 'health ' + cls;
        els[i].textContent = text;
        els[i].title = tip;
        els[i].style.display = 'inline-flex';
      }
    })
    .catch(hide);
})();
